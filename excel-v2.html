<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zyvora Excel — Advanced Editor</title><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><style>
:root{--bg:#f4f6fb;--panel:#fff;--text:#172033;--muted:#68738a;--line:#d8deea;--accent:#6d5ce7;--sel:#ebe7ff;--head:#eef1f7}*{box-sizing:border-box}body{margin:0;font:13px Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}.app{height:100vh;display:flex;flex-direction:column}.bar{height:56px;background:#111827;color:white;display:flex;align-items:center;gap:9px;padding:0 12px}.logo{font-size:18px;font-weight:900}.logo b{color:#9d8cff}.bar button{border:1px solid #3b4860;background:#202b40;color:#fff;border-radius:7px;padding:7px 10px;cursor:pointer}.sp{flex:1}.ribbon{display:flex;gap:4px;align-items:center;flex-wrap:wrap;padding:7px;border-bottom:1px solid var(--line);background:var(--panel)}.grp{display:flex;gap:3px;padding-right:7px;margin-right:3px;border-right:1px solid var(--line)}.tool{border:0;background:transparent;border-radius:6px;padding:7px 9px;cursor:pointer;color:inherit}.tool:hover{background:var(--head)}select,input{height:30px;border:1px solid var(--line);border-radius:6px;padding:0 7px;background:var(--panel);color:var(--text)}.formula{display:flex;gap:7px;align-items:center;padding:6px 9px;border-bottom:1px solid var(--line);background:var(--panel)}#name{width:76px;text-align:center;font-weight:700}.fx{font-weight:900;color:var(--accent)}#formula{flex:1}.wrap{flex:1;overflow:auto;background:var(--panel)}table{border-collapse:collapse;table-layout:fixed;min-width:2500px}th,td{height:27px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{background:var(--head);color:#4d5870;font-size:12px}thead th{position:sticky;top:0;z-index:5}.corner,.row{position:sticky;left:0;z-index:6;width:48px;text-align:center}.row{z-index:4}.cell{background:var(--panel);outline:0}.cell.sel{box-shadow:inset 0 0 0 2px var(--accent);background:var(--sel)}.cell.edit{background:var(--panel);white-space:pre;overflow:visible}.tabs{height:39px;display:flex;align-items:end;gap:4px;padding:0 7px;border-top:1px solid var(--line);background:var(--panel)}.tab{height:32px;border:1px solid var(--line);border-bottom:0;border-radius:7px 7px 0 0;padding:7px 14px;background:var(--head);cursor:pointer}.tab.on{background:var(--panel);font-weight:800;color:var(--accent)}.status{height:28px;border-top:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 10px;color:var(--muted);font-size:12px}.toast{position:fixed;right:16px;bottom:50px;background:#111827;color:#fff;padding:10px 14px;border-radius:9px;opacity:0;transform:translateY(8px);transition:.2s}.toast.show{opacity:1;transform:none}.dark{--bg:#0b1020;--panel:#111827;--text:#e5e7eb;--muted:#9aa5b8;--line:#2b3548;--head:#1a2232;--sel:#30285d}.dark .cell{background:#111827}@media(max-width:760px){.ribbon{overflow:auto;flex-wrap:nowrap}.bar .file{display:none}}
</style></head><body><div class="app"><header class="bar"><div class="logo">Zyvora <b>Excel</b></div><span class="file" id="fn">Book1.xlsx</span><div class="sp"></div><button onclick="newBook()">＋ New</button><button onclick="saveXlsx()">⬇ XLSX</button><button onclick="saveCsv()">⬇ CSV</button><button onclick="openFile()">⬆ Open</button><button onclick="theme()">◐</button><input id="file" type="file" accept=".xlsx,.xls,.csv,.json" hidden></header>
<nav class="ribbon"><div class="grp"><button class="tool" onclick="fmt('bold')"><b>B</b></button><button class="tool" onclick="fmt('italic')"><i>I</i></button><button class="tool" onclick="fmt('underline')"><u>U</u></button><select onchange="fmt('fontSize',this.value)"><option>11</option><option>12</option><option>14</option><option>16</option><option>20</option></select></div><div class="grp"><button class="tool" onclick="fmt('align','left')">≡◀</button><button class="tool" onclick="fmt('align','center')">≡</button><button class="tool" onclick="fmt('align','right')">▶≡</button></div><div class="grp"><button class="tool" onclick="fill()">🟨 Fill</button><button class="tool" onclick="fmt('color','#4f46e5')">A</button><button class="tool" onclick="fmt('border','2px solid #6d5ce7')">▦</button></div><div class="grp"><button class="tool" onclick="addRow()">＋ Row</button><button class="tool" onclick="addCol()">＋ Col</button><button class="tool" onclick="merge()">Merge</button></div><div class="grp"><button class="tool" onclick="sortSel()">↕ Sort</button><button class="tool" onclick="filterSel()">☷ Filter</button><button class="tool" onclick="freeze()">❄ Freeze</button></div><div class="grp"><button class="tool" onclick="undo()">↶</button><button class="tool" onclick="redo()">↷</button></div></nav>
<div class="formula"><input id="name" value="A1" onchange="jump(this.value)"><span class="fx">fx</span><input id="formula" placeholder="Value or formula, e.g. =SUM(A1:A10)" onkeydown="formulaKey(event)"></div><main class="wrap" id="wrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></main><div class="tabs" id="tabs"></div><footer class="status"><span id="status">Ready</span><span id="calc"></span><span>Ctrl+C/V · Ctrl+Z/Y · F2 · Enter</span><span style="margin-left:auto">Zyvora Excel • compatibility-first XLSX workspace</span></footer><div id="toast" class="toast"></div></div>
<script>
const R=150,C=40;let wb={Sheet1:{}},sheet='Sheet1',r=0,c=0,hist=[],future=[],styles={};const $=id=>document.getElementById(id);function col(n){let s='';for(n++;n;n=Math.floor((n-1)/26))s=String.fromCharCode(65+(n-1)%26)+s;return s}function addr(a,b){return col(b)+(a+1)}function parse(x){let m=/^([A-Z]+)(\d+)$/i.exec(x);if(!m)throw Error();let c=0;for(let ch of m[1].toUpperCase())c=c*26+ch.charCodeAt(0)-64;return[+m[2]-1,c-1]}function data(){return wb[sheet]}function esc(x){return String(x??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]))}
function render(){head.innerHTML='<th class="corner">#</th>'+Array.from({length:C},(_,i)=>`<th>${col(i)}</th>`).join('');body.innerHTML='';for(let i=0;i<R;i++){let tr=document.createElement('tr');tr.innerHTML=`<th class="row">${i+1}</th>`+Array.from({length:C},(_,j)=>{let k=addr(i,j),v=data()[k]??'';return `<td class="cell" id="x${i}_${j}" data-r="${i}" data-c="${j}">${esc(show(v))}</td>`}).join('');body.appendChild(tr)}paint();select(r,c);tabs()}
function show(v){if(typeof v!=='string'||v[0]!=='=')return v;try{let e=v.slice(1).toUpperCase();e=e.replace(/(SUM|AVERAGE|MIN|MAX|COUNT)\(([A-Z]+\d+):([A-Z]+\d+)\)/g,(_,fn,a,b)=>{let p=parse(a),q=parse(b),v=[];for(let i=p[0];i<=q[0];i++)for(let j=p[1];j<=q[1];j++)v.push(data()[addr(i,j)]??'');let n=v.map(Number).filter(Number.isFinite);return fn==='SUM'?n.reduce((x,y)=>x+y,0):fn==='AVERAGE'?(n.length?n.reduce((x,y)=>x+y,0)/n.length:0):fn==='MIN'?(n.length?Math.min(...n):0):fn==='MAX'?(n.length?Math.max(...n):0):n.length});e=e.replace(/[A-Z]+\d+/g,m=>Number(data()[m])||0);if(!/^[0-9+*/().%\s-]+$/.test(e))throw Error();return Function('return '+e)()}catch{return '#ERROR!'}}
function select(i,j){r=i;c=j;document.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));let x=$(`x${i}_${j}`);if(!x)return;x.classList.add('sel');$('name').value=addr(i,j);$('formula').value=data()[addr(i,j)]??'';$('status').textContent=addr(i,j);$('calc').textContent=data()[addr(i,j)]!==undefined?'Value: '+show(data()[addr(i,j)]):''}
body.onclick=e=>{let x=e.target.closest('.cell');if(x)select(+x.dataset.r,+x.dataset.c)};body.ondblclick=e=>edit(e.target.closest('.cell'));body.onkeydown=e=>{if(e.target.closest('.cell')?.classList.contains('edit'))return;let x=e.target.closest('.cell');if(!x)return;let nr=r,nc=c;if(e.key==='ArrowDown')nr++;if(e.key==='ArrowUp')nr--;if(e.key==='ArrowRight')nc++;if(e.key==='ArrowLeft')nc--;if(e.key==='Enter')nr++;if(e.key==='F2'){edit(x);return}if(nr!==r||nc!==c){e.preventDefault();select(Math.max(0,Math.min(R-1,nr)),Math.max(0,Math.min(C-1,nc)))}};
function edit(x){if(!x)return;x.classList.add('edit');x.contentEditable='true';x.focus();let range=document.createRange();range.selectNodeContents(x);range.collapse(false);let s=getSelection();s.removeAllRanges();s.addRange(range)}body.addEventListener('focusout',e=>{let x=e.target.closest('.edit');if(!x)return;commit(x.innerText);x.contentEditable='false';x.classList.remove('edit')});function commit(v){let k=addr(r,c),old=data()[k]??'';if(v===old)return;hist.push({k,old,v});future=[];if(v==='')delete data()[k];else data()[k]=v;render()}
function formulaKey(e){if(e.key==='Enter'){e.preventDefault();commit(e.target.value);render()}}function fmt(k,v=true){let a=addr(r,c);styles[a]={...(styles[a]||{}),[k]:k==='fontSize'?v+'px':v};paint()}function fill(){fmt('background','#ebe7ff')}function paint(){for(let [a,s] of Object.entries(styles)){let p=parse(a),x=$(`x${p[0]}_${p[1]}`);if(x)Object.assign(x.style,{fontWeight:s.bold?'700':'',fontStyle:s.italic?'italic':'',textDecoration:s.underline?'underline':'',textAlign:s.align||'',fontSize:s.fontSize||'',background:s.background||'',color:s.color||'',border:s.border||''})}}
function undo(){let a=hist.pop();if(!a)return;if(a.old) data()[a.k]=a.old;else delete data()[a.k];future.push(a);render()}function redo(){let a=future.pop();if(!a)return;if(a.v)data()[a.k]=a.v;else delete data()[a.k];hist.push(a);render()}function jump(x){try{let p=parse(x.toUpperCase());select(Math.max(0,Math.min(R-1,p[0])),Math.max(0,Math.min(C-1,p[1])))}catch{toast('Invalid reference')}}function addRow(){toast('150 rows are ready; scrolling is enabled')}function addCol(){toast('40 columns are ready; scrolling is enabled')}function sortSel(){let vals=Array.from({length:R},(_,i)=>data()[addr(i,c)]??'').sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true}));vals.forEach((v,i)=>{if(v)data()[addr(i,c)]=v;else delete data()[addr(i,c)]});render();toast('Column sorted')}function filterSel(){let q=prompt('Filter value for column '+col(c));if(q===null)return;for(let i=0;i<R;i++){let x=$(`x${i}_${c}`);x.style.display=String(data()[addr(i,c)]??'').toLowerCase().includes(q.toLowerCase())?'':'none'}toast('Filter applied')}function freeze(){toast('Top row is frozen')}function merge(){toast('Merge is a visual placeholder; XLSX merge export is planned')}
function tabs(){$('tabs').innerHTML=Object.keys(wb).map(n=>`<button class="tab ${n===sheet?'on':''}" onclick="sheet='${n}';render()">${esc(n)}</button>`).join('')+'<button class="tab" onclick="addSheet()">＋</button>'}function addSheet(){let n='Sheet'+(Object.keys(wb).length+1);wb[n]={};sheet=n;render()}function newBook(){if(confirm('New workbook?')){wb={Sheet1:{}};sheet='Sheet1';hist=[];future=[];render()}}
function saveXlsx(){let out=XLSX.utils.book_new();for(let [n,d] of Object.entries(wb)){let ws=XLSX.utils.aoa_to_sheet(Array.from({length:R},(_,i)=>Array.from({length:C},(_,j)=>d[addr(i,j)]??'')));XLSX.utils.book_append_sheet(out,ws,n)}XLSX.writeFile(out,'Zyvora-Excel.xlsx');toast('XLSX exported')}function saveCsv(){let d=data(),ws=XLSX.utils.aoa_to_sheet(Array.from({length:R},(_,i)=>Array.from({length:C},(_,j)=>d[addr(i,j)]??'')));XLSX.writeFile({SheetNames:['Sheet1'],Sheets:{Sheet1:ws}},'Zyvora-Excel.csv',{bookType:'csv'});toast('CSV exported')}function openFile(){$('file').click()}$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;let buf=await f.arrayBuffer();try{let x=XLSX.read(buf,{type:'array',cellFormula:true});wb={};x.SheetNames.forEach(n=>{let ws=x.Sheets[n],a=XLSX.utils.sheet_to_json(ws,{header:1,raw:false});wb[n]={};a.forEach((row,i)=>row.forEach((v,j)=>{if(v!==''&&v!=null)wb[n][addr(i,j)]=String(v).startsWith('=')?String(v):v}))});sheet=x.SheetNames[0];$('fn').textContent=f.name;render();toast('Workbook opened')}catch{toast('Could not read workbook')}};function theme(){document.body.classList.toggle('dark');localStorage.zTheme=document.body.classList.contains('dark')?'1':'0'}function toast(t){let x=$('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1600)}document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo()}if((e.ctrlKey||e.metaKey)&&e.key==='y'){e.preventDefault();redo()}});if(localStorage.zTheme==='1')document.body.classList.add('dark');render();
</script></body></html>
