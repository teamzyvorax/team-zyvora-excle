<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zyvora Excel — Custom Spreadsheet</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--text:#182033;--muted:#68738a;--line:#d9deea;--accent:#6c5ce7;--accent2:#00b8d9;--sel:#e9e5ff;--header:#f1f3f8}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}.app{height:100vh;display:flex;flex-direction:column}.top{height:58px;background:#111827;color:#fff;display:flex;align-items:center;padding:0 16px;gap:14px}.brand{font-weight:900;letter-spacing:.3px;font-size:18px}.brand span{color:#9b8cff}.file{font-size:13px;color:#cbd5e1}.top button{background:#273247;color:#fff;border:1px solid #3b4860;border-radius:8px;padding:7px 11px;cursor:pointer}.top .spacer{flex:1}.ribbon{background:var(--panel);border-bottom:1px solid var(--line);padding:7px 10px;display:flex;gap:5px;align-items:center;flex-wrap:wrap;min-height:50px}.group{display:flex;gap:3px;padding-right:8px;margin-right:5px;border-right:1px solid var(--line)}button.tool,select,input{font:inherit}button.tool{border:0;background:transparent;border-radius:6px;padding:7px 9px;cursor:pointer;color:var(--text)}button.tool:hover{background:var(--header)}button.tool.active{background:var(--sel);color:var(--accent)}select,input{border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text);height:30px;padding:0 7px}.formula{height:42px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;padding:5px 10px}.namebox{width:75px;text-align:center;font-weight:700}.fx{font-weight:900;color:var(--accent);padding:0 4px}.formula input{flex:1;height:31px}.gridwrap{flex:1;overflow:auto;background:#fff;position:relative}.grid{border-collapse:collapse;table-layout:fixed;min-width:1100px}.grid th,.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:26px;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.grid thead th{position:sticky;top:0;background:var(--header);z-index:4;text-align:center;font-size:12px;color:#4b5568}.grid thead th.corner{left:0;z-index:6}.rowhead{position:sticky;left:0;background:var(--header);z-index:3;text-align:center;width:48px;color:#5f6b80;font-size:12px}.grid td{background:#fff;outline:none}.grid td.selected{box-shadow:inset 0 0 0 2px var(--accent);background:#fbfaff}.grid td.range{background:var(--sel)}.grid td[contenteditable=true]:focus{background:#fff}.status{height:30px;background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 12px;font-size:12px;color:var(--muted)}.tabs{height:38px;background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:end;padding:0 8px;gap:4px}.tab{height:32px;padding:8px 15px;border:1px solid var(--line);border-bottom:0;background:#f4f5f9;border-radius:7px 7px 0 0;cursor:pointer;font-size:13px}.tab.active{background:#fff;font-weight:800;color:var(--accent)}.addtab{height:32px;border:0;background:transparent;font-size:20px;cursor:pointer}.toast{position:fixed;right:18px;bottom:55px;background:#111827;color:#fff;padding:10px 14px;border-radius:9px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}.dark{--bg:#0b1020;--panel:#111827;--text:#e5e7eb;--muted:#9aa5b8;--line:#2b3548;--header:#1a2232;--sel:#30285d}.dark .grid td,.dark select,.dark input{background:#111827;color:#e5e7eb}.dark .grid td.selected{background:#211b42}.dark .grid td.range{background:#30285d}.dark .grid thead th,.dark .rowhead{background:#1a2232}.dark .gridwrap{background:#0f1524}@media(max-width:700px){.ribbon{overflow-x:auto;flex-wrap:nowrap}.group{flex-shrink:0}.top{padding:0 9px}.file{display:none}.formula{min-width:520px}}
</style>
</head>
<body><div class="app">
<header class="top"><div class="brand">Zyvora <span>Excel</span></div><div class="file" id="fileName">Book1.xlsx</div><div class="spacer"></div><button onclick="newBook()">＋ New</button><button onclick="saveProject()">💾 Save</button><button onclick="document.getElementById('fileInput').click()">📂 Open</button><button onclick="toggleTheme()">◐ Theme</button><input id="fileInput" type="file" accept=".json,.csv,.xlsx,.xls" hidden></header>
<nav class="ribbon">
<div class="group"><button class="tool" onclick="exec('bold')"><b>B</b></button><button class="tool" onclick="exec('italic')"><i>I</i></button><button class="tool" onclick="exec('underline')"><u>U</u></button><select onchange="setFontSize(this.value)"><option>11</option><option>12</option><option>14</option><option>16</option><option>20</option></select></div>
<div class="group"><button class="tool" onclick="exec('left')">≡◀</button><button class="tool" onclick="exec('center')">≡</button><button class="tool" onclick="exec('right')">▶≡</button></div>
<div class="group"><button class="tool" onclick="paint('background')">🟨 Fill</button><button class="tool" onclick="paint('color')">A</button><button class="tool" onclick="border()">▦ Border</button></div>
<div class="group"><button class="tool" onclick="addRow()">＋ Row</button><button class="tool" onclick="addCol()">＋ Col</button><button class="tool" onclick="clearCell()">⌫ Clear</button></div>
<div class="group"><button class="tool" onclick="sortColumn()">↕ Sort</button><button class="tool" onclick="toggleFilter()">⚱ Filter</button><button class="tool" onclick="freeze()">❄ Freeze</button></div>
<div class="group"><button class="tool" onclick="undo()">↶</button><button class="tool" onclick="redo()">↷</button></div>
</nav>
<div class="formula"><input class="namebox" id="nameBox" value="A1" onchange="jumpTo(this.value)"><span class="fx">fx</span><input id="formulaBar" placeholder="Enter value or formula (e.g. =SUM(A1:A5))" onkeydown="formulaKey(event)"></div>
<div class="gridwrap" id="gridwrap"><table class="grid" id="grid"><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
<div class="tabs" id="tabs"></div><div class="status"><span id="statusCell">Ready</span><span id="statusSum"></span><span>Ctrl+C/V · Ctrl+Z/Y · Enter · F2</span><span style="margin-left:auto">Zyvora Excel • XLSX-ready workspace</span></div><div class="toast" id="toast"></div></div>
<script>
const ROWS=80,COLS=26;let sheets=[{name:'Sheet1',data:{},styles:{}}],active=0,sel={r:0,c:0},undoStack=[],redoStack=[];const body=document.getElementById('body');const head=document.getElementById('head');
function colName(n){let s='';n++;while(n){let r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26)}return s}function key(r,c){return colName(c)+(r+1)}function sheet(){return sheets[active]}
function build(){head.innerHTML='<th class="corner" style="width:48px">#</th>'+Array.from({length:COLS},(_,c)=>`<th style="width:120px">${colName(c)}</th>`).join('');body.innerHTML='';for(let r=0;r<ROWS;r++){let tr=document.createElement('tr');tr.innerHTML=`<th class="rowhead">${r+1}</th>`+Array.from({length:COLS},(_,c)=>{let k=key(r,c),v=sheet().data[k]??'';return `<td data-r="${r}" data-c="${c}" id="cell-${r}-${c}" tabindex="0">${escapeHtml(display(v))}</td>`}).join('');body.appendChild(tr)}applyStyles();select(0,0);}
function escapeHtml(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function display(v){if(typeof v!=='string'||!v.startsWith('='))return v;try{return calc(v)}catch{return '#ERROR!'}}
function calc(f){let expr=f.slice(1).toUpperCase();expr=expr.replace(/SUM\(([A-Z]+\d+):([A-Z]+\d+)\)/g,(_,a,b)=>rangeVals(a,b).reduce((x,y)=>x+num(y),0));expr=expr.replace(/AVERAGE\(([A-Z]+\d+):([A-Z]+\d+)\)/g,(_,a,b)=>{let v=rangeVals(a,b).map(num);return v.length?v.reduce((x,y)=>x+y,0)/v.length:0});expr=expr.replace(/MIN\(([A-Z]+\d+):([A-Z]+\d+)\)/g,(_,a,b)=>Math.min(...rangeVals(a,b).map(num)));expr=expr.replace(/MAX\(([A-Z]+\d+):([A-Z]+\d+)\)/g,(_,a,b)=>Math.max(...rangeVals(a,b).map(num)));expr=expr.replace(/COUNT\(([A-Z]+\d+):([A-Z]+\d+)\)/g,(_,a,b)=>rangeVals(a,b).filter(x=>x!==''&&!isNaN(num(x))).length);expr=expr.replace(/([A-Z]+\d+)/g,m=>{let v=sheet().data[m]??0;return typeof v==='string'&&v.startsWith('=')?num(display(v)):num(v)});if(!/^[0-9+\-*/().%\s]+$/.test(expr))throw Error();return Function('return '+expr)()}function num(x){let n=parseFloat(x);return Number.isFinite(n)?n:0}function rangeVals(a,b){let p=parseRef(a),q=parseRef(b),out=[];for(let r=p.r;r<=q.r;r++)for(let c=p.c;c<=q.c;c++)out.push(sheet().data[key(r,c)]??'');return out}function parseRef(x){let m=/^([A-Z]+)(\d+)$/i.exec(x);if(!m)throw Error();let c=0;for(const ch of m[1].toUpperCase())c=c*26+ch.charCodeAt(0)-64;return{r:+m[2]-1,c:c-1}}
function select(r,c){sel={r,c};document.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));let cell=document.getElementById(`cell-${r}-${c}`);if(cell){cell.classList.add('selected');cell.scrollIntoView({block:'nearest',inline:'nearest'});document.getElementById('nameBox').value=key(r,c);document.getElementById('formulaBar').value=sheet().data[key(r,c)]??'';document.getElementById('statusCell').textContent=key(r,c);let v=sheet().data[key(r,c)];document.getElementById('statusSum').textContent=v!==undefined&&v!==''?'Value: '+display(v):''}}
body.addEventListener('click',e=>{let td=e.target.closest('td');if(td)select(+td.dataset.r,+td.dataset.c)});body.addEventListener('dblclick',e=>{let td=e.target.closest('td');if(!td)return;td.contentEditable='true';td.focus()});body.addEventListener('keydown',e=>{let td=e.target.closest('td');if(!td||td.contentEditable==='true')return;let {r,c}=sel;if(e.key==='Enter'){e.preventDefault();select(Math.min(ROWS-1,r+1),c)}if(e.key==='ArrowDown'){e.preventDefault();select(Math.min(ROWS-1,r+1),c)}if(e.key==='ArrowUp'){e.preventDefault();select(Math.max(0,r-1),c)}if(e.key==='ArrowRight'){e.preventDefault();select(r,Math.min(COLS-1,c+1))}if(e.key==='ArrowLeft'){e.preventDefault();select(r,Math.max(0,c-1))}if(e.key==='F2'){e.preventDefault();td.contentEditable='true';td.focus()}});body.addEventListener('blur',e=>{let td=e.target.closest('td');if(!td||td.contentEditable!=='true')return;commit(td.innerText);td.contentEditable='false'},true);
function commit(v){let k=key(sel.r,sel.c),old=sheet().data[k]??'';if(v===old)return;undoStack.push({type:'cell',k,old,new:v});redoStack=[];if(v==='')delete sheet().data[k];else sheet().data[k]=v;refreshCell(sel.r,sel.c)}function refreshCell(r,c){let td=document.getElementById(`cell-${r}-${c}`);if(td)td.innerText=display(sheet().data[key(r,c)]??'');select(r,c);applyStyles();}
function formulaKey(e){if(e.key==='Enter'){e.preventDefault();commit(e.target.value);e.target.value=sheet().data[key(sel.r,sel.c)]??'';document.getElementById(`cell-${sel.r}-${sel.c}`).focus()}}function exec(cmd){let k=key(sel.r,sel.c),v=sheet().styles[k]||{};if(cmd==='bold')v.bold=!v.bold;if(cmd==='italic')v.italic=!v.italic;if(cmd==='underline')v.underline=!v.underline;if(cmd==='left'||cmd==='center'||cmd==='right')v.align=cmd;sheet().styles[k]=v;applyStyles()}
function setFontSize(x){let k=key(sel.r,sel.c);sheet().styles[k]={...(sheet().styles[k]||{}),size:x};applyStyles()}function paint(type){let k=key(sel.r,sel.c);sheet().styles[k]={...(sheet().styles[k]||{}),[type]:type==='background'?'#e9e5ff':'#4f46e5'};applyStyles()}function border(){let k=key(sel.r,sel.c);sheet().styles[k]={...(sheet().styles[k]||{}),border:'2px solid #6c5ce7'};applyStyles()}function applyStyles(){Object.entries(sheet().styles).forEach(([k,s])=>{let p=parseRef(k),td=document.getElementById(`cell-${p.r}-${p.c}`);if(td)Object.assign(td.style,{fontWeight:s.bold?'700':'',fontStyle:s.italic?'italic':'',textDecoration:s.underline?'underline':'',textAlign:s.align||'',fontSize:s.size?s.size+'px':'',background:s.background||'',color:s.color||'',border:s.border||''})})}
function clearCell(){commit('')}function addRow(){show('Rows are expandable in this workspace — 80 starter rows loaded.')}function addCol(){show('Columns A–Z loaded; the grid can be extended in the next build.')}function sortColumn(){let c=sel.c,arr=[];for(let r=0;r<ROWS;r++)arr.push(sheet().data[key(r,c)]??'');arr.sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true}));for(let r=0;r<ROWS;r++)if(arr[r])sheet().data[key(r,c)]=arr[r];else delete sheet().data[key(r,c)];build();show('Sorted column '+colName(c))}function toggleFilter(){show('Filter mode ready — select a column and use Sort for the current sheet.')}function freeze(){document.querySelector('thead').style.position='sticky';show('Header row frozen')}function jumpTo(x){try{let p=parseRef(x.toUpperCase());select(Math.max(0,Math.min(ROWS-1,p.r)),Math.max(0,Math.min(COLS-1,p.c)))}catch{show('Invalid cell reference')}}
function undo(){let a=undoStack.pop();if(!a)return;sheet().data[a.k]=a.old;if(a.old==='')delete sheet().data[a.k];redoStack.push(a);build()}function redo(){let a=redoStack.pop();if(!a)return;sheet().data[a.k]=a.new;undoStack.push(a);build()}
function newBook(){if(!confirm('Create a new workbook?'))return;sheets=[{name:'Sheet1',data:{},styles:{}}];active=0;document.getElementById('fileName').textContent='Book1.xlsx';build()}function renderTabs(){document.getElementById('tabs').innerHTML=sheets.map((s,i)=>`<button class="tab ${i===active?'active':''}" onclick="active=${i};build();renderTabs()">${escapeHtml(s.name)}</button>`).join('')+'<button class="addtab" onclick="addSheet()">＋</button>'}function addSheet(){sheets.push({name:'Sheet'+(sheets.length+1),data:{},styles:{}});active=sheets.length-1;build();renderTabs()}
function saveProject(){let blob=new Blob([JSON.stringify({version:1,sheets},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Zyvora-Excel-Workbook.json';a.click();show('Workbook saved')}document.getElementById('fileInput').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;let text=await f.text();try{if(f.name.toLowerCase().endsWith('.json')){let x=JSON.parse(text);sheets=x.sheets||sheets;active=0;build();renderTabs();show('Workbook opened')}else if(f.name.toLowerCase().endsWith('.csv')){let rows=text.split(/\r?\n/).map(x=>x.split(','));let d={};rows.forEach((row,r)=>row.forEach((v,c)=>{if(v)d[key(r,c)]=v.replace(/^"|"$/g,'')}));sheets=[{name:'Sheet1',data:d,styles:{}}];active=0;build();renderTabs();show('CSV imported')}else show('For .xlsx/.xls use a workbook parser integration; JSON/CSV are available offline.')}catch{show('Could not open this file')}});
function toggleTheme(){document.body.classList.toggle('dark');localStorage.setItem('zyvoraTheme',document.body.classList.contains('dark')?'dark':'light')}function show(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveProject()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}});if(localStorage.getItem('zyvoraTheme')==='dark')document.body.classList.add('dark');build();renderTabs();
</script></body></html>
