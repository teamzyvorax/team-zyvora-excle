<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zyvora Excel — Ribbon Maker</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Segoe UI,Arial;background:#0b1020;color:#e8ecf5}button,input,select{font:inherit}button{cursor:pointer}.top{height:58px;background:#111827;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #273247}.logo{font-size:19px;font-weight:900}.logo b{color:#9b8cff}.sp{flex:1}.top button,.btn{background:#202b40;color:#fff;border:1px solid #3b4860;border-radius:8px;padding:8px 11px}.layout{height:calc(100vh - 58px);display:grid;grid-template-columns:280px 1fr 300px;gap:0}.side,.inspector{background:#111827;border-right:1px solid #273247;padding:16px;overflow:auto}.inspector{border-left:1px solid #273247;border-right:0}.main{background:#f4f6fb;color:#182033;overflow:auto}.title{font-weight:800;margin-bottom:10px}.list{display:flex;flex-direction:column;gap:7px}.item{background:#1a2232;border:1px solid #2c3850;border-radius:9px;padding:10px;display:flex;align-items:center;gap:8px}.item.active{border-color:#8b7cff;box-shadow:0 0 0 1px #8b7cff33}.item span{flex:1}.mini{padding:5px 8px;border-radius:6px;border:1px solid #3b4860;background:#202b40;color:#fff}.preview{margin:18px;border:1px solid #d8deea;border-radius:12px;background:#fff;overflow:hidden;box-shadow:0 10px 30px #0002}.tabs{display:flex;border-bottom:1px solid #d8deea;padding:0 10px}.rtab{padding:12px 18px;border:0;background:transparent;font-weight:700;color:#69738a}.rtab.active{color:#6d5ce7;border-bottom:3px solid #6d5ce7}.ribbon{min-height:105px;display:flex;gap:10px;padding:10px;background:#fff}.group{min-width:120px;border-right:1px solid #e1e5ed;padding:0 12px 20px;position:relative;display:flex;align-items:center;gap:5px}.group:last-child{border:0}.groupname{position:absolute;bottom:3px;left:0;right:12px;text-align:center;color:#7b8495;font-size:11px}.command{min-width:55px;height:58px;border:0;background:#fff;border-radius:8px;color:#273247}.command:hover{background:#eeeaff;color:#6d5ce7}.icon{font-size:22px;display:block}.command small{display:block;margin-top:4px}.empty{padding:28px;color:#8791a5}.form{display:flex;flex-direction:column;gap:8px}.form input,.form select{height:36px;border:1px solid #3b4860;border-radius:7px;background:#0b1020;color:#fff;padding:0 9px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.danger{background:#54283a}.help{color:#9aa5b8;font-size:12px;line-height:1.5;margin-top:12px}
</style></head><body><header class="top"><div class="logo">Zyvora <b>Excel</b></div><strong>Custom Ribbon Maker</strong><div class="sp"></div><button onclick="addTab()">＋ Tab</button><button onclick="addGroup()">＋ Group</button><button onclick="addCommand()">＋ Button</button><button onclick="save()">💾 Save</button><button onclick="exportJson()">⇩ Export</button><button onclick="importJson()">⇧ Import</button><input id="file" type="file" accept=".json" hidden></header><div class="layout"><aside class="side"><div class="title">Ribbon Structure</div><div id="tree" class="list"></div><div class="help">Select a tab, group or button. Use the inspector to rename, configure and reorder your own Ribbon.</div></aside><main class="main"><div class="preview"><div id="tabs" class="tabs"></div><div id="ribbon" class="ribbon"></div></div><div style="padding:18px;color:#68738a">Live preview • Changes are saved locally and can be exported as JSON.</div></main><aside class="inspector"><div class="title">Inspector</div><div id="inspector" class="empty">Select an item to edit it.</div></aside></div><script>
const key='zyvora.custom.ribbon.v1';let model=JSON.parse(localStorage.getItem(key)||'null')||{tabs:[{id:'home',name:'Home',groups:[{id:'clipboard',name:'Clipboard',commands:[{id:'paste',name:'Paste',icon:'📋',action:'paste'},{id:'copy',name:'Copy',icon:'📄',action:'copy'}]},{id:'font',name:'Font',commands:[{id:'bold',name:'Bold',icon:'B',action:'bold'},{id:'italic',name:'Italic',icon:'I',action:'italic'}]}]},{id:'insert',name:'Insert',groups:[{id:'cells',name:'Cells',commands:[{id:'row',name:'New Row',icon:'↕',action:'insertRow'},{id:'column',name:'New Column',icon:'↔',action:'insertColumn'}]}]}]};let selected={type:'tab',ti:0,gi:0,ci:0};const $=id=>document.getElementById(id);function id(){return Math.random().toString(36).slice(2,9)}function current(){let t=model.tabs[selected.ti];if(selected.type==='tab')return t;let g=t.groups[selected.gi];if(selected.type==='group')return g;return g.commands[selected.ci]}function render(){renderTree();renderPreview();renderInspector()}function renderTree(){let h='';model.tabs.forEach((t,ti)=>{h+=`<div class="item ${selected.type==='tab'&&selected.ti===ti?'active':''}" onclick="select('tab',${ti})">📁 <span>${esc(t.name)}</span><button class="mini" onclick="event.stopPropagation();moveTab(${ti},-1)">↑</button><button class="mini" onclick="event.stopPropagation();moveTab(${ti},1)">↓</button></div>`;t.groups.forEach((g,gi)=>{h+=`<div class="item ${selected.type==='group'&&selected.ti===ti&&selected.gi===gi?'active':''}" style="margin-left:15px" onclick="select('group',${ti},${gi})">▦ <span>${esc(g.name)}</span></div>`;g.commands.forEach((c,ci)=>h+=`<div class="item ${selected.type==='command'&&selected.ti===ti&&selected.gi===gi&&selected.ci===ci?'active':''}" style="margin-left:30px" onclick="select('command',${ti},${gi},${ci})">${esc(c.icon||'◆')} <span>${esc(c.name)}</span></div>`)});});$('tree').innerHTML=h||'<div class="empty">No tabs</div>'}function renderPreview(){let th='';model.tabs.forEach((t,i)=>th+=`<button class="rtab ${i===selected.ti?'active':''}" onclick="select('tab',${i})">${esc(t.name)}</button>`);$('tabs').innerHTML=th;let t=model.tabs[selected.ti];$('ribbon').innerHTML=t? t.groups.map((g,gi)=>`<div class="group"><div style="display:flex;gap:4px">${g.commands.map((c,ci)=>`<button class="command" onclick="run('${c.action}')"><span class="icon">${esc(c.icon||'◆')}</span><small>${esc(c.name)}</small></button>`).join('')}</div><div class="groupname">${esc(g.name)}</div></div>`).join(''):'<div class="empty">Create a tab to start.</div>'}function renderInspector(){let x=current();if(!x){$('inspector').innerHTML='<div class="empty">Nothing selected.</div>';return}let isC=selected.type==='command';$('inspector').innerHTML=`<div class="form"><label>Name</label><input id="ename" value="${esc(x.name)}"><label>Icon</label><input id="eicon" value="${esc(x.icon||'')}" ${isC?'':'disabled'}><label>${isC?'Action':'Type'}</label>${isC?`<select id="eaction"><option value="bold">Bold</option><option value="italic">Italic</option><option value="copy">Copy</option><option value="paste">Paste</option><option value="insertRow">Insert Row</option><option value="insertColumn">Insert Column</option><option value="custom">Custom</option></select>`:`<input value="${selected.type==='tab'?'Ribbon Tab':'Ribbon Group'}" disabled>`}<div class="actions"><button class="btn" onclick="applyEdit()">Apply</button><button class="btn" onclick="duplicate()">Duplicate</button><button class="btn danger" onclick="removeSelected()">Delete</button></div></div>`;if(isC)$('eaction').value=x.action||'custom'}function esc(v){return String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]))}function select(type,ti,gi=0,ci=0){selected={type,ti,gi,ci};render()}function addTab(){model.tabs.push({id:id(),name:'New Tab',groups:[]});select('tab',model.tabs.length-1)}function addGroup(){let t=model.tabs[selected.ti];if(!t)return; t.groups.push({id:id(),name:'New Group',commands:[]});select('group',selected.ti,t.groups.length-1)}function addCommand(){let t=model.tabs[selected.ti];if(!t)return;let gi=selected.type==='group'?selected.gi:(t.groups.length-1);if(gi<0){addGroup();gi=t.groups.length-1}t.groups[gi].commands.push({id:id(),name:'New Button',icon:'✨',action:'custom'});select('command',selected.ti,gi,t.groups[gi].commands.length-1)}function applyEdit(){let x=current();x.name=$('ename').value.trim()||'Untitled';if(selected.type==='command'){x.icon=$('eicon').value||'◆';x.action=$('eaction').value}save();render()}function removeSelected(){if(selected.type==='tab'){model.tabs.splice(selected.ti,1);selected={type:'tab',ti:Math.max(0,selected.ti-1)}}else if(selected.type==='group'){model.tabs[selected.ti].groups.splice(selected.gi,1);selected={type:'tab',ti:selected.ti}}else{model.tabs[selected.ti].groups[selected.gi].commands.splice(selected.ci,1);selected={type:'group',ti:selected.ti,gi:selected.gi}}save();render()}function duplicate(){let x=JSON.parse(JSON.stringify(current()));x.id=id();x.name=x.name+' Copy';if(selected.type==='tab')model.tabs.splice(selected.ti+1,0,x);else if(selected.type==='group')model.tabs[selected.ti].groups.splice(selected.gi+1,0,x);else model.tabs[selected.ti].groups[selected.gi].commands.splice(selected.ci+1,0,x);save();render()}function moveTab(i,d){let n=i+d;if(n<0||n>=model.tabs.length)return;[model.tabs[i],model.tabs[n]]=[model.tabs[n],model.tabs[i]];selected={type:'tab',ti:n};save();render()}function run(action){let msg='Command: '+action;alert(msg+'\nConnected to Zyvora Excel command registry.')}function save(){localStorage.setItem(key,JSON.stringify(model));}function exportJson(){save();let b=new Blob([JSON.stringify(model,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='zyvora-ribbon.json';a.click()}function importJson(){ $('file').click()}$('file').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{model=JSON.parse(r.result);selected={type:'tab',ti:0};save();render()}catch{alert('Invalid Ribbon JSON')}};r.readAsText(f)};render();
</script></body></html>
