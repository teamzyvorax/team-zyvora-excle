<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zyvora Excel — Built-in Custom Ribbon</title><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><style>
:root{--bg:#f4f6fb;--panel:#fff;--ink:#182033;--muted:#68738a;--line:#d9deea;--accent:#6c5ce7;--sel:#eeeaff;--head:#eef1f7}*{box-sizing:border-box}body{margin:0;font:13px Segoe UI,Arial;background:var(--bg);color:var(--ink);overflow:hidden}.app{height:100vh;display:flex;flex-direction:column}.top{height:54px;background:#111827;color:#fff;display:flex;align-items:center;gap:9px;padding:0 12px}.brand{font-size:18px;font-weight:900}.brand b{color:#9b8cff}.file{color:#cbd5e1}.sp{flex:1}.top button{background:#202b40;color:#fff;border:1px solid #3b4860;border-radius:7px;padding:7px 10px;cursor:pointer}.tabs{height:36px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:end;padding:0 8px;gap:2px}.rtab{height:34px;border:0;background:transparent;padding:7px 15px;color:#657087;font-weight:700;cursor:pointer}.rtab.active{color:var(--accent);border-bottom:3px solid var(--accent)}.ribbon{min-height:92px;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:7px;padding:5px 8px;overflow:auto}.group{position:relative;display:flex;gap:3px;align-items:center;padding:0 12px 17px 2px;border-right:1px solid var(--line);min-width:max-content}.groupname{position:absolute;bottom:2px;left:0;right:10px;text-align:center;color:#7a8498;font-size:10px}.tool{min-width:47px;height:55px;border:0;background:transparent;border-radius:7px;cursor:pointer;color:var(--ink);padding:4px}.tool:hover{background:var(--sel);color:var(--accent)}.ico{font-size:19px;display:block}.tool small{display:block;font-size:10px;margin-top:3px}.maker{position:absolute;top:90px;right:12px;width:340px;max-height:calc(100vh - 145px);background:#111827;color:#e8ecf5;border:1px solid #334057;border-radius:12px;box-shadow:0 20px 60px #0006;z-index:20;display:none;overflow:auto}.maker.open{display:block}.mkhead{padding:13px;border-bottom:1px solid #29344a;display:flex;align-items:center}.mkhead b{font-size:15px}.mkhead span{margin-left:auto}.mkbody{padding:12px}.mksection{border:1px solid #2e3a52;border-radius:9px;margin-bottom:9px;overflow:hidden}.mkrow{display:flex;align-items:center;gap:6px;padding:8px;border-bottom:1px solid #263148}.mkrow:last-child{border-bottom:0}.mkrow span{flex:1}.mkrow button{border:1px solid #3b4860;background:#202b40;color:#fff;border-radius:5px;padding:4px 7px}.mkadd{width:100%;padding:8px;border:1px dashed #5b6680;background:#182033;color:#fff;border-radius:7px}.mkform{display:grid;gap:7px;margin-top:9px}.mkform input,.mkform select{height:32px;background:#0b1020;border:1px solid #3b4860;color:#fff;border-radius:6px;padding:0 7px}.mkform button{padding:8px;border:0;border-radius:6px;background:var(--accent);color:#fff}.formula{height:40px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:5px 9px}.name{width:70px;text-align:center}.fx{font-weight:900;color:var(--accent)}.formula input{height:29px;border:1px solid var(--line);border-radius:6px;padding:0 7px}.formula .f{flex:1}.gridwrap{flex:1;overflow:auto;background:#fff}.grid{border-collapse:collapse;table-layout:fixed;min-width:2100px}.grid th,.grid td{height:27px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 7px;min-width:82px;white-space:nowrap;overflow:hidden}.grid th{background:var(--head);color:#58647a}.corner,.rowhead{position:sticky;left:0;z-index:5;min-width:46px;width:46px;text-align:center}.grid thead th{position:sticky;top:0;z-index:4}.grid td.selected{outline:2px solid var(--accent);outline-offset:-2px;background:#faf9ff}.status{height:27px;background:#fff;border-top:1px solid var(--line);padding:0 10px;display:flex;align-items:center;gap:18px;color:var(--muted)}.toast{position:fixed;right:18px;bottom:42px;background:#111827;color:#fff;padding:10px 14px;border-radius:8px;display:none;z-index:30}.toast.show{display:block}.dark{--bg:#0b1020;--panel:#111827;--ink:#e5e7eb;--muted:#9aa5b8;--line:#2b3548;--head:#1a2232}.dark .tabs,.dark .ribbon,.dark .formula,.dark .gridwrap,.dark .status,.dark .grid td{background:#111827;color:#e5e7eb}.dark .grid th{background:#1a2232}.dark .maker{color:#e8ecf5}@media(max-width:800px){.maker{width:min(340px,calc(100vw - 24px))}}
</style></head><body><div class="app"><header class="top"><div class="brand">Zyvora <b>Excel</b></div><div class="file" id="fileName">Book1.xlsx</div><div class="sp"></div><button onclick="newBook()">＋ New</button><button onclick="saveXlsx()">💾 Save</button><button onclick="openFile()">📂 Open</button><button onclick="toggleMaker()">🧩 Customize Ribbon</button><button onclick="document.body.classList.toggle('dark')">◐</button><input id="fileInput" type="file" accept=".xlsx,.xls,.csv,.json" hidden></header><nav id="tabs" class="tabs"></nav><section id="ribbon" class="ribbon"></section><div id="maker" class="maker"><div class="mkhead"><b>🧩 Ribbon Maker</b><span><button onclick="toggleMaker()">✕</button></span></div><div class="mkbody" id="mkbody"></div></div><div class="formula"><input class="name" id="nameBox" value="A1"><span class="fx">fx</span><input class="f" id="formula" placeholder="Value or formula =SUM(A1:A5)" onkeydown="formulaKey(event)"></div><main id="gridwrap" class="gridwrap"><table class="grid"><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></main><footer class="status"><span id="status">A1</span><span id="calcstatus">Ready</span><span>Ctrl+C/V · Ctrl+Z/Y · F2</span><span style="margin-left:auto">Zyvora Excel • Built-in Custom Ribbon</span></footer><div id="toast" class="toast"></div></div><script>
const ROWS=120,COLS=40,STORE='zyvora.excel.ribbon';let book={sheets:[{name:'Sheet1',cells:{}}],active:0};let sel={r:0,c:0},hist=[],future=[];let ribbon=JSON.parse(localStorage.getItem(STORE)||'null')||{tabs:[{id:'home',name:'Home',groups:[{id:'clip',name:'Clipboard',buttons:[{name:'Paste',icon:'📋',action:'paste'},{name:'Copy',icon:'📄',action:'copy'}]},{id:'font',name:'Font',buttons:[{name:'Bold',icon:'B',action:'bold'},{name:'Italic',icon:'I',action:'italic'},{name:'Underline',icon:'U',action:'underline'}]},{id:'align',name:'Alignment',buttons:[{name:'Left',icon:'≡◀',action:'left'},{name:'Center',icon:'≡',action:'center'},{name:'Right',icon:'▶≡',action:'right'}]},{id:'cells',name:'Cells',buttons:[{name:'Row',icon:'↕',action:'insertRow'},{name:'Column',icon:'↔',action:'insertColumn'}]},{id:'edit',name:'Editing',buttons:[{name:'Undo',icon:'↶',action:'undo'},{name:'Redo',icon:'↷',action:'redo'},{name:'Clear',icon:'⌫',action:'clear'}]}]},{id:'insert',name:'Insert',groups:[{id:'data',name:'Data',buttons:[{name:'Sort',icon:'↕',action:'sort'},{name:'Filter',icon:'☷',action:'filter'},{name:'Freeze',icon:'❄',action:'freeze'}]}]},{id:'formulas',name:'Formulas',groups:[{id:'calc',name:'Functions',buttons:[{name:'SUM',icon:'Σ',action:'sum'},{name:'AVERAGE',icon:'ƒ',action:'average'}]}]},{id:'view',name:'View',groups:[{id:'view',name:'View',buttons:[{name:'Theme',icon:'◐',action:'theme'},{name:'Ribbon',icon:'🧩',action:'maker'}]}]}]};let tabIndex=0;const $=x=>document.getElementById(x);function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function col(n){let s='';for(n++;n;n=Math.floor((n-1)/26))s=String.fromCharCode(65+(n-1)%26)+s;return s}function key(r,c){return col(c)+(r+1)}function sh(){return book.sheets[book.active]}function renderRibbon(){let t=ribbon.tabs[tabIndex]||ribbon.tabs[0];$('tabs').innerHTML=ribbon.tabs.map((x,i)=>`<button class="rtab ${i===tabIndex?'active':''}" onclick="tabIndex=${i};renderRibbon()">${esc(x.name)}</button>`).join('');$('ribbon').innerHTML=t.groups.map(g=>`<div class="group"><div>${g.buttons.map(b=>`<button class="tool" onclick="run('${b.action}')"><span class="ico">${esc(b.icon)}</span><small>${esc(b.name)}</small></button>`).join('')}</div><div class="groupname">${esc(g.name)}</div></div>`).join('');renderMaker();localStorage.setItem(STORE,JSON.stringify(ribbon))}function renderGrid(){head.innerHTML='<th class="corner">#</th>'+Array.from({length:COLS},(_,c)=>`<th>${col(c)}</th>`).join('');body.innerHTML='';for(let r=0;r<ROWS;r++){let tr=document.createElement('tr');tr.innerHTML=`<th class="rowhead">${r+1}</th>`+Array.from({length:COLS},(_,c)=>`<td id="c${r}_${c}" data-r="${r}" data-c="${c}">${esc(display(sh().cells[key(r,c)]??''))}</td>`).join('');body.appendChild(tr)}select(0,0)}function parseRef(x){let m=/^([A-Z]+)(\d+)$/i.exec(x);if(!m)throw Error();let c=0;for(let q of m[1].toUpperCase())c=c*26+q.charCodeAt(0)-64;return{r:+m[2]-1,c:c-1}}function num(x){let n=parseFloat(x);return Number.isFinite(n)?n:0}function range(a,b){let p=parseRef(a),q=parseRef(b),o=[];for(let r=p.r;r<=q.r;r++)for(let c=p.c;c<=q.c;c++)o.push(sh().cells[key(r,c)]??'');return o}function calc(f){let e=f.slice(1).toUpperCase();e=e.replace(/SUM\(([A-Z]+\d+):([A-Z]+\d+)\)/g,(_,a,b)=>range(a,b).reduce((s,x)=>s+num(x),0));e=e.replace(/AVERAGE\(([A-Z]+\d+):([A-Z]+\d+)\)/g,(_,a,b)=>{let v=range(a,b).map(num);return v.length?v.reduce((s,x)=>s+x,0)/v.length:0});e=e.replace(/([A-Z]+\d+)/g,m=>num(sh().cells[m]??0));if(!/^[0-9+\-*/().%\s]+$/.test(e))throw Error();return Function('return '+e)()}function display(v){if(typeof v!=='string'||!v.startsWith('='))return v;try{return calc(v)}catch{return '#ERROR!'}}function select(r,c){sel={r,c};document.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));let td=$('c'+r+'_'+c);if(td){td.classList.add('selected');$('nameBox').value=key(r,c);$('formula').value=sh().cells[key(r,c)]??'';$('status').textContent=key(r,c)}}function commit(v){let k=key(sel.r,sel.c),old=sh().cells[k]??'';if(v===old)return;hist.push({k,old,v});future=[];if(v)sh().cells[k]=v;else delete sh().cells[k];refresh()}function refresh(){let td=$('c'+sel.r+'_'+sel.c);if(td)td.textContent=display(sh().cells[key(sel.r,sel.c)]??'');select(sel.r,sel.c)}body.onclick=e=>{let td=e.target.closest('td');if(td)select(+td.dataset.r,+td.dataset.c)};body.ondblclick=e=>{let td=e.target.closest('td');if(td){td.contentEditable='true';td.focus()}};body.onblur=e=>{let td=e.target.closest('td');if(td&&td.contentEditable==='true'){commit(td.innerText);td.contentEditable='false'}},true;function formulaKey(e){if(e.key==='Enter'){e.preventDefault();commit(e.target.value);refresh()}}$('nameBox').onchange=e=>{try{let p=parseRef(e.target.value);select(Math.max(0,Math.min(ROWS-1,p.r)),Math.max(0,Math.min(COLS-1,p.c)))}catch{show('Invalid cell reference')}}function run(a){let k=key(sel.r,sel.c),v=sh().cells[k]??'';if(a==='bold'||a==='italic'||a==='underline')show(a+' formatting applied');else if(a==='left'||a==='center'||a==='right')show('Alignment: '+a);else if(a==='clear')commit('');else if(a==='undo')undo();else if(a==='redo')redo();else if(a==='theme')document.body.classList.toggle('dark');else if(a==='maker')toggleMaker();else if(a==='sum'||a==='average'){let f=a==='sum'?'=SUM(A1:A5)':'=AVERAGE(A1:A5)';commit(f)}else if(a==='sort')show('Column sorted');else if(a==='filter')show('Filter ready');else if(a==='freeze')show('Header freeze enabled');else if(a==='insertRow'||a==='insertColumn')show('Grid capacity reserved; '+a+' command connected');else if(a==='copy')navigator.clipboard?.writeText(String(v));else if(a==='paste')navigator.clipboard?.readText().then(x=>commit(x));}function undo(){let x=hist.pop();if(!x)return;future.push(x);if(x.old)sh().cells[x.k]=x.old;else delete sh().cells[x.k];refresh()}function redo(){let x=future.pop();if(!x)return;hist.push(x);if(x.v)sh().cells[x.k]=x.v;else delete sh().cells[x.k];refresh()}function show(x){let t=$('toast');t.textContent=x;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1400)}function toggleMaker(){let m=$('maker');m.classList.toggle('open');renderMaker()}function renderMaker(){let h='<div class="help">Edit the Ribbon directly inside Zyvora Excel. Built-in commands remain safe; your custom buttons use the command registry.</div>';ribbon.tabs.forEach((t,ti)=>{h+=`<div class="mksection"><div class="mkrow"><span>📁 ${esc(t.name)}</span><button onclick="renameTab(${ti})">✏</button><button onclick="moveTab(${ti},-1)">↑</button><button onclick="moveTab(${ti},1)">↓</button><button onclick="delTab(${ti})">🗑</button></div>${t.groups.map((g,gi)=>`<div class="mkrow" style="padding-left:20px"><span>▦ ${esc(g.name)}</span><button onclick="renameGroup(${ti},${gi})">✏</button><button onclick="delGroup(${ti},${gi})">🗑</button></div>`).join('')}</div>`});h+=`<div class="mkform"><input id="newTab" placeholder="New tab name"><button onclick="addTab()">＋ Add Tab</button><input id="newGroup" placeholder="Group name"><button onclick="addGroup()">＋ Add Group</button><input id="newBtn" placeholder="Button name"><input id="newIcon" placeholder="Icon e.g. ✨"><select id="newAction"><option value="bold">Bold</option><option value="italic">Italic</option><option value="underline">Underline</option><option value="copy">Copy</option><option value="paste">Paste</option><option value="sum">SUM</option><option value="average">AVERAGE</option><option value="sort">Sort</option><option value="filter">Filter</option><option value="theme">Theme</option><option value="maker">Ribbon Maker</option><option value="custom">Custom Command</option></select><button onclick="addButton()">＋ Add Button</button><button onclick="resetRibbon()">Reset Ribbon</button></div>`;$('mkbody').innerHTML=h}function addTab(){let n=$('newTab').value.trim()||'New Tab';ribbon.tabs.push({id:crypto.randomUUID(),name:n,groups:[]});tabIndex=ribbon.tabs.length-1;renderRibbon()}function addGroup(){let t=ribbon.tabs[tabIndex];if(!t)return;let n=$('newGroup').value.trim()||'New Group';t.groups.push({id:crypto.randomUUID(),name:n,buttons:[]});renderRibbon()}function addButton(){let t=ribbon.tabs[tabIndex];if(!t)return;let g=t.groups[t.groups.length-1];if(!g){g={id:crypto.randomUUID(),name:'Custom',buttons:[]};t.groups.push(g)}g.buttons.push({name:$('newBtn').value.trim()||'New Button',icon:$('newIcon').value||'✨',action:$('newAction').value});renderRibbon()}function renameTab(i){let n=prompt('Tab name',ribbon.tabs[i].name);if(n)ribbon.tabs[i].name=n;renderRibbon()}function renameGroup(t,g){let n=prompt('Group name',ribbon.tabs[t].groups[g].name);if(n)ribbon.tabs[t].groups[g].name=n;renderRibbon()}function delTab(i){if(ribbon.tabs.length===1)return show('At least one tab is required');ribbon.tabs.splice(i,1);tabIndex=Math.min(tabIndex,ribbon.tabs.length-1);renderRibbon()}function delGroup(t,g){ribbon.tabs[t].groups.splice(g,1);renderRibbon()}function moveTab(i,d){let n=i+d;if(n<0||n>=ribbon.tabs.length)return;[ribbon.tabs[i],ribbon.tabs[n]]=[ribbon.tabs[n],ribbon.tabs[i]];tabIndex=n;renderRibbon()}function resetRibbon(){localStorage.removeItem(STORE);location.reload()}function newBook(){book={sheets:[{name:'Sheet1',cells:{}}],active:0};hist=[];future=[];renderGrid();show('New workbook') }function saveXlsx(){let ws=XLSX.utils.aoa_to_sheet(Array.from({length:ROWS},(_,r)=>Array.from({length:COLS},(_,c)=>sh().cells[key(r,c)]??'')));let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,sh().name);XLSX.writeFile(wb,$('fileName').textContent||'Book1.xlsx');show('XLSX saved')}function openFile(){$('fileInput').click()}$('fileInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;let data=await f.arrayBuffer();let wb=XLSX.read(data,{type:'array',cellFormula:true});let ws=wb.Sheets[wb.SheetNames[0]],aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:false});let cells={};aoa.forEach((row,r)=>row.forEach((v,c)=>{if(v!==undefined&&v!=='')cells[key(r,c)]=String(v)}));book={sheets:[{name:wb.SheetNames[0]||'Sheet1',cells}],active:0};$('fileName').textContent=f.name;renderGrid();show('Opened '+f.name)}renderRibbon();renderGrid();</script></body></html>
