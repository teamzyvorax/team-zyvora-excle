<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zyvora Excel — Production Editor</title><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><style>:root{--bg:#f4f6fb;--p:#fff;--t:#182033;--m:#68738a;--l:#d9deea;--a:#705cf6;--s:#eeeaff;--h:#edf1f7}*{box-sizing:border-box}body{margin:0;font:13px Segoe UI,Arial;background:var(--bg);color:var(--t);overflow:hidden}.app{height:100vh;display:flex;flex-direction:column}.top{height:54px;background:#101827;color:#fff;display:flex;align-items:center;gap:8px;padding:0 12px}.brand{font-size:18px;font-weight:900}.brand b{color:#9b8cff}.file{color:#cbd5e1;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sp{flex:1}.top button,.mk button{background:#202b40;color:#fff;border:1px solid #3b4860;border-radius:7px;padding:7px 10px;cursor:pointer}.tabs{height:36px;background:var(--p);border-bottom:1px solid var(--l);display:flex;align-items:end;padding:0 8px;gap:2px;overflow:auto}.rtab{height:34px;border:0;background:transparent;padding:7px 15px;color:#657087;font-weight:700;cursor:pointer}.rtab.active{color:var(--a);border-bottom:3px solid var(--a)}.ribbon{min-height:92px;background:var(--p);border-bottom:1px solid var(--l);display:flex;gap:6px;padding:5px 8px;overflow:auto}.group{position:relative;display:flex;gap:3px;align-items:center;padding:0 12px 17px 2px;border-right:1px solid var(--l);min-width:max-content}.groupname{position:absolute;bottom:2px;left:0;right:8px;text-align:center;color:#7a8498;font-size:10px}.tool{min-width:48px;height:55px;border:0;background:transparent;border-radius:7px;cursor:pointer;color:var(--t);padding:4px}.tool:hover{background:var(--s);color:var(--a)}.ico{font-size:19px;display:block}.tool small{display:block;font-size:10px;margin-top:3px}.formula{height:40px;background:var(--p);border-bottom:1px solid var(--l);display:flex;align-items:center;gap:6px;padding:5px 9px}. sition:fixed;right:18px;bottom:42px;background:#101827;color:#fff;padding:10px 14px;border-radius:8px;display:none;z-index:30}.toast.show{display:block}.dark{--bg:#0b1020;--p:#111827;--t:#e5e7eb;--m:#9aa5b8;--l:#2b3548;--h:#1a2232}.dark .grid td.edit{background:#0f1728}</style></head><body><div class="app"><header class="top"><div class="brand">Zyvora <b>Excel</b></div><div class="file" id="fn">Book1.xlsx</div><div class="sp"></div><button onclick="newBook()">＋ New</button><button onclick="saveXlsx()">💾 Save</button><button onclick="openFile()">📂 Open</button><button onclick="toggleMaker()">🧩 Ribbon</button><button onclick="theme()">◐</button><input id="fi" type="file" accept=".xlsx,.xls,.csv,.ods,.json" hidden></header><nav id="tabs" class="tabs"></nav><section id="rib" class="ribbon"></section><div id="maker" class="maker"><div class="mkhead"><b>🧩 Zyvora Ribbon Maker</b><span><button onclick="toggleMaker()">✕</button></span></div><div id="mk" class="mkbody"></div></div><div class="formula"><input id="name" class="name" value="A1"><b class="fx">fx</b><input id="form" class="f" placeholder="Value or formula =SUM(A1:A5)"></div><main id="wrap" class="gridwrap"><table class="grid"><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></main><div id="sheets" class="sheets"></div><footer class="status"><span id="status">A1</span><span>Ctrl+C/V · Ctrl+Z/Y · F2 · arrows</span><span style="margin-left:auto">Zyvora Excel • Production Editor</span></footer><div id="toast" class="toast"></div></div><script>
const R=200,C=50,STORE='zyvora.excel.ribbon.v3',$=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function col(n){let s='';for(n++;n;n=Math.floor((n-1)/26))s=String.fromCharCode(65+(n-1)%26)+s;return s}function key(r,c){return col(c)+(r+1)}function ref(x){let m=/^([A-Z]+)(\d+)$/i.exec(x.trim());if(!m)throw 0;let c=0;for(let q of m[1].toUpperCase())c=c*26+q.charCodeAt(0)-64;return{r:+m[2]-1,c:c-1}}
const DEF={tabs:[{name:'Home',groups:[{name:'Clipboard',buttons:[['Copy','📄','copy'],['Paste','📋','paste']]},{name:'Font',buttons:[['Bold','B','bold'],['Italic','I','italic'],['Underline','U','underline']]},{name:'Alignment',buttons:[['Left','≡◀','left'],['Center','≡','center'],['Right','▶≡','right']]},{name:'Cells',buttons:[['Insert Row','↕','ir'],['Insert Col','↔','ic'],['Delete Row','−↕','dr'],['Delete Col','−↔','dc']]},{name:'Edit',buttons:[['Undo','↶','undo'],['Redo','↷','redo'],['Clear','⌫','clear']]}]},{name:'Data',groups:[{name:'Data',buttons:[['Sort','↕','sort'],['Filter','☷','filter'],['Freeze','❄','freeze']]},{name:'Sheets',buttons:[['Add Sheet','＋','add'],['Rename','✏','rename'],['Delete','🗑','delete']]}]},{name:'Formulas',groups:[{name:'Functions',buttons:[['SUM','Σ','sum'],['AVERAGE','ƒ','avg'],['MIN','↓','min'],['MAX','↑','max'],['COUNT','#','count']]}]},{name:'View',groups:[{name:'View',buttons:[['Theme','◐','theme'],['Ribbon Maker','🧩','maker'],['Reset','↺','reset']]}]}]};
let ribbon=JSON.parse(localStorage.getItem(STORE)||'null')||structuredClone(DEF),ti=0,book={sheets:[{name:'Sheet1',cells:{},styles:{},hidden:{}}],active:0},sel={r:0,c:0},anchor={r:0,c:0},editing=false,undoStack=[],redoStack=[],clip='';function sh(){return book.sheets[book.active]}function saveRibbon(){localStorage.setItem(STORE,JSON.stringify(ribbon))}function renderRibbon(){let t=ribbon.tabs[ti]||ribbon.tabs[0];$('tabs').innerHTML=ribbon.tabs.map((x,i)=>`<button class="rtab ${i==ti?'active':''}" onclick="ti=${i};renderRibbon()">${esc(x.name)}</button>`).join('');$('rib').innerHTML=t.groups.map(g=>`<div class="group"><div>${g.buttons.map(b=>`<button class="tool" onclick="run('${esc(b[2])}')"><span class="ico">${esc(b[1])}</span><small>${esc(b[0])}</small></button>`).join('')}</div><div class="groupname">${esc(g.name)}</div></div>`).join('');saveRibbon();renderMaker()}
function renderSheets(){$('sheets').innerHTML=book.sheets.map((s,i)=>`<button class="sheet ${i==book.active?'active':''}" onclick="book.active=${i};sel={r:0,c:0};anchor={r:0,c:0};renderGrid();renderSheets()" ondblclick="renameAt(${i})">${esc(s.name)}</button>`).join('')+'<button class="sheet" onclick="addSheet()">＋</button>'}
function num(v){let n=Number(v);return Number.isFinite(n)?n:0}function vals(a,b){let p=ref(a),q=ref(b),o=[];for(let r=Math.min(p.r,q.r);r<=Math.max(p.r,q.r);r++)for(let c=Math.min(p.c,q.c);c<=Math.max(p.c,q.c);c++)o.push(sh().cells[key(r,c)]??'');return o}function calc(f){let e=f.slice(1).toUpperCase(),fs={SUM:v=>v.reduce((a,b)=>a+num(b),0),AVERAGE:v=>v.length?v.reduce((a,b)=>a+num(b),0)/v.length:0,MIN:v=>v.length?Math.min(...v.map(num)):0,MAX:v=>v.length?Math.max(...v.map(num)):0,COUNT:v=>v.filter(x=>Number.isFinite(Number(x))).length};for(let n in fs)e=e.replace(new RegExp(n+'\\(([A-Z]+\\d+):([A-Z]+\\d+)\\)','g'),(_,a,b)=>fs[n](vals(a,b)));e=e.replace(/([A-Z]+\d+)/g,m=>num(sh().cells[m]??0));if(!/^[0-9+\-*/().%\s]+$/.test(e))throw 0;return Function('return '+e)()}function display(v){if(typeof v!='string'||v[0]!='=')return v;try{return calc(v)}catch{return '#ERROR!'}}function sty(k){let s=sh().styles[k]||{};return `font-weight:${s.b?'700':'400'};font-style:${s.i?'italic':'normal'};text-decoration:${s.u?'underline':'none'};text-align:${s.a||'left'}`}
function inside(r,c){return r>=Math.min(anchor.r,sel.r)&&r<=Math.max(anchor.r,sel.r)&&c>=Math.min(anchor.c,sel.c)&&c<=Math.max(anchor.c,sel.c)}function select(r,c,move=true){sel={r:Math.max(0,Math.min(R-1,r)),c:Math.max(0,Math.min(C-1,c))};document.querySelectorAll('.sel,.range').forEach(x=>x.classList.remove('sel','range'));for(let rr=Math.min(anchor.r,sel.r);rr<=Math.max(anchor.r,sel.r);rr++)for(let cc=Math.min(anchor.c,sel.c);cc<=Math.max(anchor.c,sel.c);cc++){let td=$(`c${rr}_${cc}`);if(td)td.classList.add(rr==sel.r&&cc==sel.c?'sel':'range')}let k=key(sel.r,sel.c);$('name').value=k;$('form').value=sh().cells[k]??'';$('status').textContent=(anchor.r==sel.r&&anchor.c==sel.c)?k:`${key(anchor.r,anchor.c)}:${k}`;if(move)$(`c${sel.r}_${sel.c}`)?.scrollIntoView({block:'nearest',inline:'nearest'})}
function renderGrid(){let h='<th class="corner">#</th>';for(let c=0;c<C;c++)h+=`<th>${col(c)}</th>`;$('head').innerHTML=h;let out='';for(let r=0;r<R;r++){if(sh().hidden[r])continue;out+=`<tr><th class="rowhead">${r+1}</th>`;for(let c=0;c<C;c++){let k=key(r,c);out+=`<td id="c${r}_${c}" data-r="${r}" data-c="${c}" style="${sty(k)}">${esc(display(sh().cells[k]??''))}</td>`}out+='</tr>'}$('body').innerHTML=out;select(sel.r,sel.c,false);renderSheets()}
function setCell(r,c,v){let k=key(r,c),old=sh().cells[k]??'';if(String(old)==String(v))return null;if(v===''||v==null)delete sh().cells[k];else sh().cells[k]=String(v);return{k,old,v:v??''}}function commit(v){let x=setCell(sel.r,sel.c,v);if(x){undoStack.push([x]);redoStack=[];renderGrid()}}function clearSel(){let ch=[];for(let r=Math.min(anchor.r,sel.r);r<=Math.max(anchor.r,sel.r);r++)for(let c=Math.min(anchor.c,sel.c);c<=Math.max(anchor.c,sel.c);c++){let x=setCell(r,c,'');if(x)ch.push(x)}if(ch.length){undoStack.push(ch);redoStack=[];renderGrid()}}function undo(){let x=undoStack.pop();if(!x)return;redoStack.push(x);x.forEach(a=>a.old?sh().cells[a.k]=a.old:delete sh().cells[a.k]);renderGrid()}function redo(){let x=redoStack.pop();if(!x)return;undoStack.push(x);x.forEach(a=>a.v?sh().cells[a.k]=a.v:delete sh().cells[a.k]);renderGrid()}
$('body').onclick=e=>{let td=e.target.closest('td');if(td&&!editing){let r=+td.dataset.r,c=+td.dataset.c;if(e.shiftKey)select(r,c);else{anchor={r,c};select(r,c)}}};$('body').ondblclick=e=>startEdit(e.target.closest('td'));$('body').onkeydown=e=>{if(editing)return;if(e.key=='F2'){e.preventDefault();startEdit($(`c${sel.r}_${sel.c}`));return}if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();if(!e.shiftKey)anchor={...sel};select(sel.r+(e.key=='ArrowDown')-(e.key=='ArrowUp'),sel.c+(e.key=='ArrowRight')-(e.key=='ArrowLeft'))}if(e.key=='Delete'||e.key=='Backspace'){e.preventDefault();clearSel()}};document.addEventListener('keydown',e=>{if(editing)return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='z'){e.preventDefault();undo()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='y'){e.preventDefault();redo()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='c'){e.preventDefault();copy()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='v'){e.preventDefault();paste()}});
function startEdit(td){if(!td)return;editing=true;td.classList.add('edit');td.contentEditable='true';td.textContent=sh().cells[key(+td.dataset.r,+td.dataset.c)]??'';td.focus();document.execCommand?.('selectAll',false,null);td.onblur=()=>{if(editing){editing=false;td.contentEditable='false';td.classList.remove('edit');commit(td.textContent)}}}function copy(){let rows=[];for(let r=Math.min(anchor.r,sel.r);r<=Math.max(anchor.r,sel.r);r++){let a=[];for(let c=Math.min(anchor.c,sel.c);c<=Math.max(anchor.c,sel.c);c++)a.push(sh().cells[key(r,c)]??'');rows.push(a.join('\t'))}clip=rows.join('\n');navigator.clipboard?.writeText(clip);show('Copied')}async function paste(){let t=clip;try{t=await navigator.clipboard.readText()||t}catch{}if(!t)return;let ch=[];t.replace(/\r/g,'').split('\n').forEach((line,rr)=>line.split('\t').forEach((v,cc)=>{let x=setCell(sel.r+rr,sel.c+cc,v);if(x)ch.push(x)}));if(ch.length){undoStack.push(ch);redoStack=[];renderGrid();show('Pasted')}}
function format(p){for(let r=Math.min(anchor.r,sel.r);r<=Math.max(anchor.r,sel.r);r++)for(let c=Math.min(anchor.c,sel.c);c<=Math.max(anchor.c,sel.c);c++){let k=key(r,c),s=sh().styles[k]||{};s[p]=!s[p];sh().styles[k]=s}renderGrid()}function insertRows(n){let at=sel.r;for(let r=R-n-1;r>=at;r--)for(let c=0;c<C;c++){let a=key(r,c),b=key(r+n,c);if(sh().cells[a]!=null)sh().cells[b]=sh().cells[a];else delete sh().cells[b]}renderGrid();show('Row inserted')}function insertCols(n){let at=sel.c;for(let c=C-n-1;c>=at;c--)for(let r=0;r<R;r++){let a=key(r,c),b=key(r,c+n);if(sh().cells[a]!=null)sh().cells[b]=sh().cells[a];else delete sh().cells[b]}renderGrid();show('Column inserted')}function sortCol(){let c=sel.c,a=[];for(let r=0;r<R;r++)a.push(Array.from({length:C},(_,x)=>sh().cells[key(r,x)]??''));a.sort((x,y)=>String(x[c]).localeCompare(String(y[c]),undefined,{numeric:true}));for(let r=0;r<R;r++)for(let x=0;x<C;x++)a[r][x]?sh().cells[key(r,x)]=a[r][x]:delete sh().cells[key(r,x)];renderGrid();show('Sorted')}function filterCol(){let q=prompt('Filter '+col(sel.c)+':','');if(q==null)return;for(let r=0;r<R;r++)sh().hidden[r]=q&&!String(sh().cells[key(r,sel.c)]??'').toLowerCase().includes(q.toLowerCase());renderGrid();show('Filter applied')}function freeze(){let th=$('head');th.parentElement.parentElement.querySelector('thead').style.position='sticky';th.parentElement.parentElement.querySelector('thead').style.top='0';show('Header frozen')}
function addSheet(){book.sheets.push({name:'Sheet'+(book.sheets.length+1),cells:{},styles:{},hidden:{}});book.active=book.sheets.length-1;sel={r:0,c:0};anchor={r:0,c:0};renderGrid();show('Sheet added')}function renameAt(i){let n=prompt('Sheet name',book.sheets[i].name);if(n)book.sheets[i].name=n;renderSheets()}function delSheet(){if(book.sheets.length<2)return show('Keep one sheet');book.sheets.splice(book.active,1);book.active=Math.max(0,book.active-1);renderGrid();show('Sheet deleted')}
function run(a){if(a=='copy')return copy();if(a=='paste')return paste();if(a=='bold')return format('b');if(a=='italic')return format('i');if(a=='underline')return format('u');if(['left','center','right'].includes(a)){for(let r=Math.min(anchor.r,sel.r);r<=Math.max(anchor.r,sel.r);r++)for(let c=Math.min(anchor.c,sel.c);c<=Math.max(anchor.c,sel.c);c++)(sh().styles[key(r,c)]||{}).a=a;renderGrid();return}if(a=='undo')return undo();if(a=='redo')return redo();if(a=='clear')return clearSel();if(a=='ir')return insertRows(1);if(a=='ic')return insertCols(1);if(a=='dr')return insertRows(1);if(a=='dc')return insertCols(1);if(a=='sort')return sortCol();if(a=='filter')return filterCol();if(a=='freeze')return freeze();if(a=='add')return addSheet();if(a=='rename')return renameAt(book.active);if(a=='delete')return delSheet();if(a=='theme')return theme();if(a=='maker')return toggleMaker();if(a=='reset'){localStorage.removeItem(STORE);location.reload();return}if(['sum','avg','min','max','count'].includes(a)){let n={sum:'SUM',avg:'AVERAGE',min:'MIN',max:'MAX',count:'COUNT'}[a];return commit('='+n+'(A1:A5)')}}
function newBook(){book={sheets:[{name:'Sheet1',cells:{},styles:{},hidden:{}}],active:0};undoStack=[];redoStack=[];$('fn').textContent='Book1.xlsx';renderGrid();show('New workbook')}function saveXlsx(){let wb=XLSX.utils.book_new();for(let s of book.sheets){let ws=XLSX.utils.aoa_to_sheet(Array.from({length:R},(_,r)=>Array.from({length:C},(_,c)=>s.cells[key(r,c)]??'')));XLSX.utils.book_append_sheet(wb,ws,s.name.slice(0,31))}XLSX.writeFile(wb,$('fn').textContent||'Book1.xlsx');show('XLSX saved')}function openFile(){$('fi').click()}$('fi').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellFormula:true});book={sheets:wb.SheetNames.map(n=>{let a=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false}),cells={};a.forEach((row,r)=>row.forEach((v,c)=>{if(v!==undefined&&v!=='')cells[key(r,c)]=String(v)}));return{name:n,cells,styles:{},hidden:{}}}),active:0};$('fn').textContent=f.name;renderGrid();show('Opened '+f.name)}catch(x){show('Open failed')}};
$('form').onkeydown=e=>{if(e.key=='Enter'){e.preventDefault();commit(e.target.value)}};$('name').onchange=e=>{try{let p=ref(e.target.value);anchor={r:p.r,c:p.c};select(p.r,p.c)}catch{show('Invalid reference')}};
function theme(){document.body.classList.toggle('dark');localStorage.setItem('zyvora.excel.theme',document.body.classList.contains('dark')?'dark':'light')}if(localStorage.getItem('zyvora.excel.theme')=='dark')document.body.classList.add('dark');function toggleMaker(){$('maker').classList.toggle('open');renderMaker()}function renderMaker(){let h='<div style="color:#9aa5b8;margin-bottom:8px">Built-in Ribbon Maker • saved locally</div>';ribbon.tabs.forEach((t,i)=>{h+=`<div class="mkrow"><span>📁 ${esc(t.name)}</span><button onclick="renTab(${i})">✏</button><button onclick="moveTab(${i},-1)">↑</button><button onclick="moveTab(${i},1)">↓</button><button onclick="delTab(${i})">🗑</button></div>`});h+=`<div class="mkform"><input id="nt" placeholder="New tab"><button onclick="addTab()">＋ Add tab</button><input id="ng" placeholder="New group"><button onclick="addGroup()">＋ Add group</button><input id="nb" placeholder="Button name"><input id="ni" placeholder="Icon"><select id="na"><option value="bold">Bold</option><option value="italic">Italic</option><option value="underline">Underline</option><option value="copy">Copy</option><option value="paste">Paste</option><option value="sum">SUM</option><option value="avg">AVERAGE</option><option value="sort">Sort</option><option value="filter">Filter</option><option value="theme">Theme</option><option value="maker">Ribbon Maker</option></select><button onclick="addButton()">＋ Add button</button><button onclick="localStorage.removeItem(STORE);location.reload()">↺ Reset Ribbon</button></div>`;$('mk').innerHTML=h}function addTab(){ribbon.tabs.push({name:$('nt').value.trim()||'New Tab',groups:[]});ti=ribbon.tabs.length-1;renderRibbon()}function addGroup(){let t=ribbon.tabs[ti];t.groups.push({name:$('ng').value.trim()||'New Group',buttons:[]});renderRibbon()}function addButton(){let t=ribbon.tabs[ti],g=t.groups[t.groups.length-1];if(!g){g={name:'Custom',buttons:[]};t.groups.push(g)}g.buttons.push([$('nb').value.trim()||'New Button',$('ni').
