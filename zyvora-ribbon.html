<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zyvora Excel — Custom Ribbon</title><style>:root{--bg:#f5f6f8;--p:#fff;--ink:#20252d;--muted:#687180;--line:#d8dce3;--a:#6b4cff;--hover:#eeeaff;--press:#e0d9ff}*{box-sizing:border-box}body{margin:0;font:13px Segoe UI,Arial;background:var(--bg);color:var(--ink);overflow:hidden}.app{height:100vh;display:flex;flex-direction:column}.title{height:34px;background:var(--p);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 8px}.logo{width:24px;height:24px}.brand{font-weight:800}.brand b{color:var(--a)}.book,.muted{color:var(--muted)}.sp{flex:1}.qa button,.account{border:0;background:transparent;color:var(--muted);cursor:pointer}.tabs{height:35px;background:var(--p);border-bottom:1px solid var(--line);display:flex;overflow:auto}.tab{border:0;background:transparent;padding:0 15px;color:#4f5866;font-weight:600;cursor:pointer;position:relative;white-space:nowrap}.tab:hover{background:#faf9ff;color:var(--a)}.tab.active{color:var(--a)}.tab.active:after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:3px;background:var(--a)}.file{background:#6848d9;color:#fff!important;font-weight:800}.ribbon{height:108px;background:var(--p);border-bottom:1px solid var(--line);display:flex;padding:4px 6px 0;overflow:auto}.group{position:relative;min-width:max-content;border-right:1px solid var(--line);padding:2px 9px 19px;display:flex;gap:3px}.gname{position:absolute;bottom:3px;left:4px;right:4px;text-align:center;font-size:10px;color:#7a8290}.tool{min-width:52px;height:74px;border:1px solid transparent;background:transparent;border-radius:4px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px;cursor:pointer;color:var(--ink)}.tool:hover{background:var(--hover);border-color:#d8d0ff;color:var(--a)}.tool:active{background:var(--press)}.ico{height:30px;width:30px;display:grid;place-items:center;font-size:23px}.tool b{font-size:10px;white-space:nowrap}.formula{height:38px;background:var(--p);border-bottom:1px solid var(--line);display:flex;gap:6px;align-items:center;padding:4px}.name{width:72px;height:27px;border:1px solid var(--line);font-weight:600}.formula input:last-of-type{flex:1;height:27px;border:1px solid var(--line)}.sheet{flex:1;overflow:auto;background:#fff}table{border-collapse:collapse;table-layout:fixed;min-width:1800px}.grid th,.grid td{height:27px;min-width:82px;border-right:1px solid #dfe2e7;border-bottom:1px solid #dfe2e7;padding:3px 7px;white-space:nowrap;overflow:hidden}.grid th{background:#f1f3f6;color:#5e6672}.grid td{background:#fff;cursor:cell}.corner,.row{position:sticky;left:0;z-index:4;width:43px;min-width:43px;text-align:center}.grid thead th{position:sticky;top:0;z-index:3}.selected{outline:2px solid var(--a);outline-offset:-2px;background:#f1eeff!important}.sheets{height:31px;background:var(--p);border-top:1px solid var(--line);padding:3px 7px}.sheetbtn{border:0;background:transparent;padding:5px 13px}.sheetbtn.active{color:var(--a);font-weight:700;border-bottom:2px solid var(--a)}.footer{height:25px;background:#f7f8fa;border-top:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 9px;color:#737b88;font-size:11px}.right{margin-left:auto}.toast{position:fixed;right:18px;bottom:40px;background:#222;color:#fff;padding:9px 13px;border-radius:5px;display:none;z-index:30}.toast.show{display:block}.collapsed .ribbon{display:none}.shade{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:50}.shade.open{display:flex}.options{width:min(760px,94vw);height:min(570px,90vh);background:#fff;border-radius:5px;box-shadow:0 25px 80px #0007;display:flex;flex-direction:column}.oh{height:44px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;font-weight:700}.ob{display:flex;flex:1;min-height:0}.left{width:155px;border-right:1px solid var(--line);padding:8px 0}.left button{display:block;width:100%;padding:9px 13px;text-align:left;border:0;background:transparent}.left .on{background:#dff1e8;color:#177a4b;font-weight:700}.main{flex:1;padding:14px;display:flex;flex-direction:column}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;min-height:0}.pane{border:1px solid #ccd1d9;overflow:auto}.pane h4{margin:0;padding:8px;background:#f1f3f6;border-bottom:1px solid var(--line)}.item{padding:6px 8px;cursor:pointer}.item:hover{background:var(--hover)}.tree{padding:5px}.tree div{padding:4px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.actions button,.foot button{padding:6px 10px;border:1px solid #b9bec7;background:#fff;border-radius:3px;cursor:pointer}.foot{height:50px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;gap:7px;padding:0 12px}.primary{background:var(--a)!important;color:#fff!important;border-color:var(--a)!important}@media(max-width:850px){.left{display:none}.cols{grid-template-columns:1fr}.tool{min-width:45px}}</style></head><body><div class="app" id="app"><header class="title"><div class="qa"><button onclick="cmd('Save')">↪</button><button onclick="cmd('Undo')">↶</button><button onclick="cmd('Redo')">↷</button></div><div class="logo"><svg viewBox="0 0 32 32"><path d="M4 3h24v26H4z" fill="#6b4cff"/><path d="M9 8l5 8-5 8h4l3-5 3 5h4l-5-8 5-8h-4l-3 5-3-5z" fill="#fff"/></svg></div><div class="brand">Zyvora <b>Excel</b></div><div class="book">Book1.xlsx</div><div class="sp"></div><span class="muted">Ready</span><button class="account" onclick="cmd('Account')">Zyvora Account ▾</button></header><nav class="tabs" id="tabs"></nav><section class="ribbon" id="ribbon"></section><div class="formula"><input class="name" id="name" value="A1"><b style="color:var(--a)">fx</b><input id="formula" placeholder="Enter value or formula"><span>✓</span><span>✕</span></div><main class="sheet"><table class="grid"><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></main><div class="sheets"><button class="sheetbtn active">Sheet1</button><button class="sheetbtn">＋</button></div><footer class="footer"><span id="cell">A1</span><span>READY</span><span>Ctrl+C/V · Ctrl+Z/Y · F2 · Arrow Keys</span><span class="right">Zyvora Excel • Custom Ribbon 2013</span></footer></div><div class="toast" id="toast"></div><div class="shade" id="shade"><section class="options"><div class="oh">Zyvora Excel Options <button style="margin-left:auto;border:0;background:transparent" onclick="closeOpt()">✕</button></div><div class="ob"><aside class="left"><button>General</button><button>Formulas</button><button>Proofing</button><button>Save</button><button>Language</button><button>Advanced</button><button class="on">Customize Ribbon</button><button>Quick Access Toolbar</button><button>Add-Ins</button><button>Trust Center</button></aside><div class="main"><b>Customize the Ribbon</b><p class="muted">Your custom tabs and groups are stored locally for Zyvora Excel.</p><div class="cols"><div class="pane"><h4>Choose commands from</h4><div id="commands"></div></div><div class="pane"><h4>Customize the Ribbon — Main Tabs</h4><div class="tree" id="tree"></div></div></div><div class="actions"><button onclick="newTab()">New Tab</button><button onclick="newGroup()">New Group</button><button onclick="renameTab()">Rename…</button><button onclick="move(-1)">▲</button><button onclick="move(1)">▼</button><button onclick="removeTab()">Remove</button><button onclick="reset()">Reset</button></div></div></div><div class="foot"><button onclick="closeOpt()">Cancel</button><button class="primary" onclick="closeOpt();save()">OK</button></div></section></div><script>const $=x=>document.getElementById(x),R=70,C=28;const base={Home:[['Clipboard',['Paste','Cut','Copy']],['Font',['Bold','Italic','Underline']],['Alignment',['Left','Center','Right']],['Cells',['Insert Row','Insert Col','Merge']],['Editing',['Undo','Redo','Clear']]],Insert:[['Tables',['Table','Pivot Table']],['Illustrations',['Image','Shapes']],['Charts',['Chart','Sparklines']],['Links',['Link','Comment']]],'Page Layout':[['Page Setup',['Margins','Orientation','Size']],['Print',['Print','Print Area']],['View Options',['Gridlines','Headers']]],Formulas:[['Function Library',['Insert Function','AutoSum','Financial']],['Formula Auditing',['Trace','Evaluate','Error Check']]],Data:[['Sort & Filter',['Sort','Filter','Clear']],['Data Tools',['Validation','Remove Duplicates','Text to Columns']],['Queries',['Refresh','Connections']]],Review:[['Proofing',['Spelling','Comments']],['Protect',['Protect Sheet','Unlock']]],View:[['Workbook Views',['Normal','Page Layout','Full Screen']],['Show',['Gridlines','Formula Bar']],['Zoom',['Zoom In','Zoom Out']]],Developer:[['Code',['Visual Tools','Macros']],['Controls',['Insert Control','Design Mode']]],'TEAM ZYVORA':[['LG CODE',['LG CODE','LG Studio','LG Tools','LG Build','LG Export']]]};let tabs=Object.keys(base).map(name=>({name,checked:true,groups:base[name].map(g=>({name:g[0],buttons:g[1]}))}));let saved=localStorage.getItem('zyvora.ribbon.team') ;if(saved)try{tabs=JSON.parse(saved)}catch{}let active='Home',sel=0;function save(){localStorage.setItem('zyvora.ribbon.team',JSON.stringify(tabs))}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function renderTabs(){let s='<button class="tab file" onclick="openOpt()">FILE</button>';s+=tabs.filter(t=>t.checked).map(t=>'<button class="tab '+(t.name===active?'active':'')+'" onclick="active='+JSON.stringify(t.name);s+=';renderTabs();renderRibbon()">'+esc(t.name)+'</button>').join('');$('tabs').innerHTML=s}function renderRibbon(){let t=tabs.find(x=>x.name===active)||tabs[0];$('ribbon').innerHTML=t.groups.map(g=>'<div class="group"><div>'+g.buttons.map(b=>'<button class="tool" title="'+esc(b)+'" onclick="cmd('+JSON.stringify(b)+')"><span class="ico">'+icon(b)+'</span><b>'+esc(b)+'</b></button>').join('')+'</div><div class="gname">'+esc(g.name)+'</div></div>').join('')}function icon(x){let m={Bold:'B',Italic:'I',Underline:'U',Paste:'▣',Cut:'✂',Copy:'▢',Undo:'↶',Redo:'↷',Sort:'↕',Filter:'▽',Chart:'▥',Table:'▦',Link:'🔗',Comment:'▢',Protect:'🔒','Protect Sheet':'🔒','LG CODE':'</>', 'LG Studio':'◈','LG Tools':'⚙','LG Build':'⚡','LG Export':'⇩'};return m[x]||'◇'}function col(n){let s='';for(n++;n;n=Math.floor((n-1)/26))s=String.fromCharCode(65+(n-1)%26)+s;return s}function grid(){let h='<th class="corner">#</th>';for(let c=0;c<C;c++)h+='<th>'+col(c)+'</th>';$('head').innerHTML=h;let b='';for(let r=0;r<R;r++){b+='<tr><th class="row">'+(r+1)+'</th>';for(let c=0;c<C;c++)b+='<td id="x'+r+'_'+c+'" data-r="'+r+'" data-c="'+c+'">'+(r===0&&c===0?'Zyvora Excel':'')+'</td>';b+='</tr>'}$('body').innerHTML=b;select(0,0)}function select(r,c){document.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));let e=$('x'+r+'_'+c);if(e){e.classList.add('selected');$('name').value=col(c)+(r+1);$('cell').textContent=$('name').value}}$('body').onclick=e=>{let x=e.target.closest('td');if(x)select(+x.dataset.r,+x.dataset.c)};function cmd(x){$('toast').textContent=x+' — Zyvora action';$('toast').classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.remove('show'),1200)}function openOpt(){sel=Math.max(0,tabs.findIndex(t=>t.name===active));renderOpt();$('shade').classList.add('open')}function closeOpt(){$('shade').classList.remove('open')}function renderOpt(){$('commands').innerHTML=['Paste','Copy','Bold','Chart','Table','Sort','Filter','LG CODE','LG Studio','LG Tools','LG Build','LG Export'].map(x=>'<div class="item" onclick="addCommand('+JSON.stringify(x)+')">'+esc(x)+'</div>').join('');$('tree').innerHTML=tabs.map((t,i)=>'<div class="item" onclick="sel='+i+';renderOpt()"><input type="checkbox" '+(t.checked?'checked':'')+' onclick="event.stopPropagation();tabs['+i+'].checked=this.checked;save();renderTabs()"> <b>'+esc(t.name)+'</b></div>'+t.groups.map(g=>'<div style="margin-left:22px;color:var(--muted)">▸ '+esc(g.name)+'</div>').join('')).join('')}function newTab(){let n=prompt('New Tab name:','TEAM ZYVORA');if(!n)return;tabs.push({name:n,checked:true,groups:[{name:'New Group',buttons:[]} ]});sel=tabs.length-1;active=n;save();renderOpt();renderTabs();renderRibbon()}function newGroup(){let t=tabs[sel];if(!t)return;let n=prompt('New Group name:','LG CODE');if(!n)return;t.groups.push({name:n,buttons:['LG CODE']});save();renderOpt();renderRibbon()}function renameTab(){let t=tabs[sel];if(!t)return;let n=prompt('Rename tab:',t.name);if(!n)return;t.name=n;active=n;save();renderOpt();renderTabs();renderRibbon()}function addCommand(n){let t=tabs[sel];if(!t)return;if(!t.groups.length)t.groups.push({name:'New Group',buttons:[]});t.groups[t.groups.length-1].buttons.push(n);save();renderOpt();renderRibbon()}function move(d){let n=sel+d;if(n<0||n>=tabs.length)return;[tabs[sel],tabs[n]]=[tabs[n],tabs[sel]];sel=n;save();renderOpt();renderTabs()}function removeTab(){if(tabs.length<2)return;tabs.splice(sel,1);sel=0;active=tabs[0].name;save();renderOpt();renderTabs();renderRibbon()}function reset(){if(!confirm('Reset Ribbon?'))return;localStorage.removeItem('zyvora.ribbon.team');location.reload()}document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='s'){e.preventDefault();cmd('Save')}if(e.ctrlKey&&e.key.toLowerCase()==='z'){e.preventDefault();cmd('Undo')}if(e.ctrlKey&&e.key.toLowerCase()==='y'){e.preventDefault();cmd('Redo')}if(e.key==='F2')cmd('Edit '+$('name').value)});renderTabs();renderRibbon();grid();</script></body></html>
