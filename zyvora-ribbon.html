<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zyvora Excel — Custom Ribbon</title><style>:root{--bg:#f4f7fb;--panel:#fff;--ink:#172033;--muted:#68738a;--line:#dbe1eb;--accent:#6d5ce7;--hover:#eeeaff}*{box-sizing:border-box}body{margin:0;font:13px "Segoe UI",Arial;background:var(--bg);color:var(--ink);overflow:hidden}.app{height:100vh;display:flex;flex-direction:column}.title{height:54px;background:#111827;color:#fff;display:flex;align-items:center;padding:0 14px;gap:12px}.brand{font-size:19px;font-weight:900}.brand span{color:#9d8cff}.book{opacity:.75}.spacer{flex:1}.top button{background:#202b40;color:#fff;border:1px solid #3b4860;border-radius:7px;padding:7px 10px;margin-left:5px}.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);padding-left:10px}.rtab{padding:9px 17px;border:0;background:transparent;font-weight:700;color:#59647a;cursor:pointer}.rtab.active{color:var(--accent);border-bottom:3px solid var(--accent)}.ribbon{min-height:88px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:stretch;padding:5px 8px;gap:8px}.group{display:flex;align-items:center;gap:4px;border-right:1px solid var(--line);padding:0 10px 18px 2px;position:relative}.group:last-child{border:0}.group label{position:absolute;bottom:2px;left:0;right:10px;text-align:center;color:#7a8498;font-size:10px}.tool{border:0;background:transparent;color:var(--ink);border-radius:7px;min-width:42px;height:42px;padding:4px;cursor:pointer}.tool:hover{background:var(--hover);color:var(--accent)}.big{font-size:20px}.tool small{display:block;font-size:10px;margin-top:2px}.formula{display:flex;gap:7px;padding:7px;background:#fff;border-bottom:1px solid var(--line)}.name{width:75px;text-align:center;font-weight:700}.formula input{height:29px;border:1px solid var(--line);border-radius:6px;padding:0 8px}.fx{font-weight:900;color:var(--accent);padding:7px}.formula .input{flex:1}.sheet{flex:1;overflow:auto;background:#fff}.grid{border-collapse:collapse;table-layout:fixed;min-width:1800px}.grid th,.grid td{height:28px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 7px;white-space:nowrap;min-width:78px}.grid th{background:#eef1f7;color:#59647a}.grid .corner,.grid .row{position:sticky;left:0;z-index:3;min-width:45px;width:45px;text-align:center}.grid thead th{position:sticky;top:0;z-index:4}.cell{outline:none}.cell.selected{box-shadow:inset 0 0 0 2px var(--accent);background:#f0edff}.status{height:28px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 10px;color:var(--muted);gap:18px}.toast{position:fixed;right:18px;bottom:48px;background:#111827;color:#fff;padding:10px 14px;border-radius:9px;display:none}.toast.show{display:block}</style></head><body><div class="app"><header class="title top"><div class="brand">Zyvora <span>Excel</span></div><div class="book">Custom Ribbon Workspace</div><div class="spacer"></div><button onclick="toast('Saved locally')">Save</button><button onclick="toast('Open command ready')">Open</button><button onclick="document.body.classList.toggle('dark')">◐</button></header><nav class="tabs"><button class="rtab active" onclick="tab(this,'Home')">Home</button><button class="rtab" onclick="tab(this,'Insert')">Insert</button><button class="rtab" onclick="tab(this,'Formulas')">Formulas</button><button class="rtab" onclick="tab(this,'Data')">Data</button><button class="rtab" onclick="tab(this,'View')">View</button></nav><section class="ribbon" id="ribbon"><div class="group"><button class="tool big" onclick="cmd('Paste')">📋<small>Paste</small></button><button class="tool big" onclick="cmd('Cut')">✂️<small>Cut</small></button><button class="tool big" onclick="cmd('Copy')">📄<small>Copy</small></button><label>Clipboard</label></div><div class="group"><button class="tool" onclick="cmd('Bold')"><b class="big">B</b><small>Bold</small></button><button class="tool" onclick="cmd('Italic')"><i class="big">I</i><small>Italic</small></button><button class="tool" onclick="cmd('Underline')"><u class="big">U</u><small>Underline</small></button><button class="tool" onclick="cmd('Fill')">🟨<small>Fill</small></button><label>Font</label></div><div class="group"><button class="tool" onclick="cmd('Left')">≡◀<small>Left</small></button><button class="tool" onclick="cmd('Center')">≡<small>Center</small></button><button class="tool" onclick="cmd('Right')">▶≡<small>Right</small></button><label>Alignment</label></div><div class="group"><button class="tool" onclick="cmd('Insert Row')">↕<small>Row</small></button><button class="tool" onclick="cmd('Insert Column')">↔<small>Column</small></button><button class="tool" onclick="cmd('Merge')">▦<small>Merge</small></button><label>Cells</label></div><div class="group"><button class="tool" onclick="cmd('Sort')">↕<small>Sort</small></button><button class="tool" onclick="cmd('Filter')">☷<small>Filter</small></button><button class="tool" onclick="cmd('Freeze')">❄<small>Freeze</small></button><label>Editing</label></div></section><div class="formula"><input class="name" id="name" value="A1"><span class="fx">fx</span><input class="input" id="formula" placeholder="Enter value or formula..."></div><main class="sheet"><table class="grid"><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></main><footer class="status"><span id="status">A1</span><span>Ready</span><span>Ctrl+C/V · Ctrl+Z/Y · F2</span><span style="margin-left:auto">Zyvora Custom Ribbon • Own Excel UI</span></footer><div class="toast" id="toast"></div></div><script>const R=80,C=26,$=x=>document.getElementById(x);let sr=0,sc=0;function col(n){let s='';for(n++;n;n=Math.floor((n-1)/26))s=String.fromCharCode(65+(n-1)%26)+s;return s}function render(){head.innerHTML='<th class="corner">#</th>'+Array.from({length:C},(_,i)=>'<th>'+col(i)+'</th>').join('');body.innerHTML=Array.from({length:R},(_,r)=>'<tr><th class="row">'+(r+1)+'</th>'+Array.from({length:C},(_,c)=>'<td class="cell" data-r="'+r+'" data-c="'+c+'">'+((r===0&&c===0)?'Zyvora Excel':'')+'</td>').join('')+'</tr>').join('');select(0,0)}function select(r,c){document.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));let x=document.querySelector('[data-r="'+r+'"][data-c="'+c+'"]');if(x){x.classList.add('selected');$('name').value=col(c)+(r+1);$('status').textContent=col(c)+(r+1)}}body.onclick=e=>{let x=e.target.closest('.cell');if(x)select(+x.dataset.r,+x.dataset.c)};function tab(b,n){document.querySelectorAll('.rtab').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(n==='Home')location.reload();else{ribbon.innerHTML='<div class="group"><button class="tool big" onclick="cmd(\''+n+' Chart\')">✨<small>'+n+'</small></button><button class="tool big" onclick="cmd(\''+n+' Tools\')">⚙<small>Tools</small></button><label>'+n+' Ribbon</label></div><div class="group"><button class="tool big" onclick="cmd(\''+n+' Action\')">＋<small>Action</small></button><button class="tool big" onclick="cmd(\''+n+' Options\')">▦<small>Options</small></button><label>Zyvora Tools</label></div>'}}function cmd(x){toast(x+' selected')}function toast(x){let t=$('toast');t.textContent=x;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1300)}render();</script></body></html>
