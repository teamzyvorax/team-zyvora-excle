<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zyvora Excel — Custom Ribbon</title><style>:root{--bg:#f3f5f9;--panel:#fff;--ink:#172033;--muted:#667085;--line:#d9dee8;--accent:#705cf6;--accent2:#9b8cff;--hover:#eeeaff;--dark:#101827}*{box-sizing:border-box}body{margin:0;font:13px"Segoe UI",Arial;background:var(--bg);color:var(--ink);overflow:hidden}.app{height:100vh;display:flex;flex-direction:column}.title{height:54px;background:var(--dark);color:#fff;display:flex;align-items:center;padding:0 12px;gap:10px}.brand{font-size:19px;font-weight:900;letter-spacing:-.3px}.brand b{color:var(--accent2)}.book{color:#cbd5e1}.spacer{flex:1}.top button{background:#202b40;color:#fff;border:1px solid #3b4860;border-radius:7px;padding:7px 10px;cursor:pointer}.tabs{height:36px;display:flex;align-items:end;background:var(--panel);border-bottom:1px solid var(--line);padding:0 8px;gap:2px;overflow:auto}.rtab{height:35px;padding:8px 16px;border:0;background:transparent;font-weight:700;color:#59647a;cursor:pointer}.rtab:hover{color:var(--accent)}.rtab.active{color:var(--accent);border-bottom:3px solid var(--accent)}.ribbon{height:96px;display:flex;background:var(--panel);border-bottom:1px solid var(--line);padding:5px 8px;gap:6px;overflow:auto}.group{position:relative;display:flex;align-items:center;gap:3px;padding:0 12px 17px 2px;border-right:1px solid var(--line);min-width:max-content}.groupname{position:absolute;bottom:2px;left:0;right:10px;text-align:center;color:#7b8497;font-size:10px}.tool{min-width:50px;height:62px;border:0;background:transparent;color:var(--ink);border-radius:7px;padding:4px;cursor:pointer}.tool:hover{background:var(--hover);color:var(--accent)}.ico{font-size:20px;display:block;line-height:25px}.tool small{display:block;font-size:10px;margin-top:3px}.formula{height:40px;display:flex;align-items:center;gap:7px;padding:5px 8px;background:var(--panel);border-bottom:1px solid var(--line)}.formula input{height:29px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:var(--panel);color:var(--ink)}.name{width:75px;text-align:center;font-weight:700}.fx{font-weight:900;color:var(--accent)}.formula .input{flex:1}.sheet{flex:1;overflow:auto;background:var(--panel)}table{border-collapse:collapse;table-layout:fixed;min-width:2100px}.grid th,.grid td{height:28px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 7px;min-width:84px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.grid th{background:#eef1f7;color:#59647a}.grid td{background:var(--panel);cursor:cell}.corner,.row{position:sticky;left:0;z-index:4;min-width:46px;width:46px;text-align:center}.grid thead th{position:sticky;top:0;z-index:5}.selected{outline:2px solid var(--accent);outline-offset:-2px;background:var(--hover)!important}.status{height:28px;background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;padding:0 10px;color:var(--muted);gap:18px}.toast{position:fixed;right:18px;bottom:42px;background:var(--dark);color:#fff;padding:10px 14px;border-radius:8px;display:none;z-index:20}.toast.show{display:block}.dark{--bg:#0b1020;--panel:#111827;--ink:#e5e7eb;--muted:#9aa5b8;--line:#2b3548;--hover:#20283b}.dark .grid th{background:#1a2232}</style></head><body><div class="app"><header class="title"><div class="brand">Zyvora <b>Excel</b></div><div class="book">Custom Ribbon Workspace</div><div class="spacer"></div><button onclick="toast('New workbook')">＋ New</button><button onclick="toast('Save')">💾 Save</button><button onclick="toast('Open')">📂 Open</button><button onclick="toggleDark()">◐ Theme</button><button onclick="toggleRibbon()">⌃ Ribbon</button></header><nav id="tabs" class="tabs"></nav><section id="ribbon" class="ribbon"></section><div class="formula"><input id="name" class="name" value="A1"><b class="fx">fx</b><input id="formula" class="input" placeholder="Enter value or formula..."></div><main class="sheet"><table class="grid"><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></main><footer class="status"><span id="status">A1</span><span>Ready</span><span>Ctrl+C/V · Ctrl+Z/Y · F2 · Arrow keys</span><span style="margin-left:auto">Zyvora Excel • Custom Ribbon</span></footer><div id="toast" class="toast"></div></div><script>const R=120,C=40,$=id=>document.getElementById(id);const tabs={Home:[['Clipboard',[['Paste','📋'],['Cut','✂️'],['Copy','📄']]],['Font',[['Bold','B'],['Italic','I'],['Underline','U'],['Color','🎨']]],['Alignment',[['Left','≡◀'],['Center','≡'],['Right','▶≡'],['Wrap','↩']]],['Cells',[['Insert Row','↕'],['Insert Col','↔'],['Merge','▦'],['Format','▤']]],['Editing',[['Undo','↶'],['Redo','↷'],['Clear','⌫']]]],Insert:[['Tables',[['Table','▦'],['Pivot','◫']]],['Illustrations',[['Image','🖼️'],['Shape','◇']]],['Charts',[['Chart','📊'],['Graph','📈']]],['Links',[['Link','🔗'],['Comment','💬']]]],PageLayout:[['Page Setup',[['Margins','▤'],['Orientation','↔'],['Size','▣']]],['Print',[['Print Area','▤'],['Preview','👁']]],['View Options',[['Gridlines','▦'],['Headers','A']]]],Formulas:[['Functions',[['SUM','Σ'],['AVERAGE','ƒ'],['MIN','↓'],['MAX','↑'],['COUNT','#']]],['Formula Tools',[['Insert Function','fx'],['Name Manager','▤'],['Evaluate','✓']]]],Data:[['Sort & Filter',[['Sort','↕'],['Filter','☷'],['Clear Filter','⌫']]],['Data Tools',[['Validation','✓'],['Remove Duplicates','◇'],['Text Columns','⇥']]],['Sheets',[['Add Sheet','＋'],['Rename','✏'],['Delete','🗑']]]],View:[['Workbook Views',[['Normal','▣'],['Full Screen','⛶']]],['Show',[['Gridlines','▦'],['Formula Bar','fx']]],['Zoom',[['Zoom In','＋'],['Zoom Out','−'],['100%','1:1']]]],Zyvora:[['Zyvora Tools',[['AI Assist','✦'],['Smart Fill','⚡'],['Theme','◐']]],['Security',[['Protect','🔒'],['Unlock','🔓']]],['Export',[['XLSX','X'],['CSV','C'],['PDF','P']]] ]};let active='Home',collapsed=false,selected={r:0,c:0};function col(n){let s='';for(n++;n;n=Math.floor((n-1)/26))s=String.fromCharCode(65+(n-1)%26)+s;return s}function renderTabs(){tabsEl.innerHTML=Object.keys(tabs).map(n=>'<button class="rtab '+(n===active?'active':'')+'" onclick="active=\''+n+'\';renderTabs();renderRibbon()">'+(n==='PageLayout'?'Page Layout':n)+'</button>').join('')}function renderRibbon(){let groups=tabs[active];ribbon.innerHTML=groups.map(g=>'<div class="group"><div>'+g[1].map(b=>'<button class="tool" onclick="cmd(\''+b[0].replace(/'/g,"\\'")+'\')"><span class="ico">'+b[1]+'</span><small>'+b[0]+'</small></button>').join('')+'</div><div class="groupname">'+g[0]+'</div></div>').join('')}function renderGrid(){head.innerHTML='<th class="corner">#</th>'+Array.from({length:C},(_,i)=>'<th>'+col(i)+'</th>').join('');body.innerHTML=Array.from({length:R},(_,r)=>'<tr><th class="row">'+(r+1)+'</th>'+Array.from({length:C},(_,c)=>'<td data-r="'+r+'" data-c="'+c+'">'+(r===0&&c===0?'Zyvora Excel':'')+'</td>').join('')+'</tr>').join('');select(0,0)}function select(r,c){selected={r,c};document.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));let x=document.querySelector('[data-r="'+r+'"][data-c="'+c+'"]');if(x){x.classList.add('selected');name.value=col(c)+(r+1);status.textContent=col(c)+(r+1)}}body.onclick=e=>{let x=e.target.closest('td');if(x)select(+x.dataset.r,+x.dataset.c)};function cmd(x){toast(x+' selected')}function toast(x){let t=$('toast');t.textContent=x;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1300)}function toggleDark(){document.body.classList.toggle('dark');localStorage.setItem('zyvora-dark',document.body.classList.contains('dark'))}function toggleRibbon(){collapsed=!collapsed;ribbon.style.display=collapsed?'none':'flex'}if(localStorage.getItem('zyvora-dark')==='true')document.body.classList.add('dark');renderTabs();renderRibbon();renderGrid();</script></body></html>
